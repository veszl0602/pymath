<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="고등학교 수학 문제를 파이썬(SymPy·NumPy·SciPy)으로 풀고 확인하는 방법을 안내합니다.">
<title>PyMath 문제풀이 안내서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* 원본 PyMath(Lovable) 디자인: 흰 바탕, 진녹색 버튼·태그, 연녹색 히어로, 남색 코드 블록 */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line2:#eef0f2;
  --brand:#108946; --brand-ink:#ffffff; --brand-soft:#e7f6ec; --brand-soft2:#f3fbf6; --hero:#eafaef;
  --code:#0d1627; --code-ink:#e6e9ef; --code-muted:#64748b; --code-line:#1e293b;
  --warn:#b4530a; --warn-soft:#fff6ec; --ok:#108946;
  --c1:#108946; --c2:#d97706; --c3:#2563eb; --grid:#eef0f2; --accent-soft:#e7f6ec;
  --sans:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"D2Coding",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#141c18; --ink:#e6ebe8; --muted:#9aa6a0; --line:#26312b; --line2:#1c2520;
  --brand:#3cbf72; --brand-ink:#06140c; --brand-soft:#17301f; --brand-soft2:#121c16; --hero:#132219;
  --code:#0a111f; --code-ink:#e6e9ef; --code-line:#1a2436; --warn:#f2a050; --warn-soft:#2a1f12;
  --c1:#3cbf72; --c2:#f2a050; --c3:#7aa7ff; --grid:#1f2a24; --accent-soft:#17301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#141c18; --ink:#e6ebe8; --muted:#9aa6a0; --line:#26312b; --line2:#1c2520;
  --brand:#3cbf72; --brand-ink:#06140c; --brand-soft:#17301f; --brand-soft2:#121c16; --hero:#132219;
  --code:#0a111f; --code-ink:#e6e9ef; --code-line:#1a2436; --warn:#f2a050; --warn-soft:#2a1f12;
  --c1:#3cbf72; --c2:#f2a050; --c3:#7aa7ff; --grid:#1f2a24; --accent-soft:#17301f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{font:inherit;color:inherit}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:12px}
.brand{font-weight:800;font-size:24px;color:var(--brand);text-decoration:none;display:flex;gap:10px;align-items:baseline;letter-spacing:-.01em}
.brand small{font-weight:500;font-size:13px;color:var(--muted)}
nav.main{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.main a{font-size:14.5px;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:500}
nav.main a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
nav.main a:not([aria-current]):hover{color:var(--brand);background:var(--brand-soft2)}
.gear{width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;flex:none;display:grid;place-items:center}
.gear:hover{color:var(--brand);border-color:var(--brand)}
.gear svg{width:20px;height:20px}
@media (max-width:760px){.brand small{display:none}nav.main{order:3;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap}nav.main a{white-space:nowrap}.gear{margin-left:auto}}
h1,h2,h3{letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800;margin:0 0 10px}
h2{font-size:22px;font-weight:800;margin:0 0 12px}
h3{font-size:17px;font-weight:700;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.sec{padding-block:36px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{margin:0}
.sec-h .muted{font-size:14px}
code{font-family:var(--mono);font-size:.88em;background:var(--brand-soft2);border:1px solid var(--line2);padding:1px 5px;border-radius:5px;word-break:break-word}
/* chips */
.tag{display:inline-flex;align-items:center;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--ink);white-space:nowrap}
.tag.lib{background:var(--brand);color:var(--brand-ink);font-family:var(--mono);font-size:12px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:7px;background:var(--brand-soft2);border:1px solid #b7e3ca;color:var(--brand);text-decoration:none;cursor:pointer}
:root[data-theme="dark"] .fchip{border-color:#285c3d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fchip{border-color:#285c3d}}
.fchip:hover{background:var(--brand);color:var(--brand-ink)}
/* hero */
.hero{position:relative;border-bottom:1px solid var(--line);background:radial-gradient(ellipse 60% 70% at 50% 0%,var(--hero),transparent 70%),repeating-linear-gradient(to bottom,transparent 0 39px,var(--line2) 39px 40px);text-align:center}
.hero .in{padding-block:64px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center}
.hero .in>*{max-width:100%}
@media (max-width:520px){.hero .in{padding-block:40px 32px}}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.32em;color:var(--brand);font-weight:500}
.hero p.lead{color:var(--muted);font-size:17px;margin:0}
.searchbar{width:min(760px,100%);display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 22px;box-shadow:0 10px 30px -12px rgba(16,137,70,.25)}
.searchbar:focus-within{border-color:var(--brand)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;padding:10px 0;color:var(--ink)}
.searchbar .ico{color:var(--muted);font-size:18px}
.hashtags{display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:center}
.hashtags button{border:0;background:none;color:var(--brand);font-size:15px;font-weight:500;cursor:pointer;padding:2px}
.hashtags button:hover{text-decoration:underline}
.results{width:min(760px,100%);text-align:left;display:grid;gap:10px}
.rgroup h3{font-size:13px;color:var(--muted);font-weight:500;margin:6px 4px}
.rcard{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rcard .s{font-weight:700}
.rcard .n{font-size:13.5px;color:var(--muted)}
.rcard a.t{font-size:13px;text-decoration:none}
/* showcase */
.show{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.show{grid-template-columns:minmax(0,1fr)}}
.prob{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;align-content:start}
.prob .f{font-size:clamp(20px,2.6vw,27px);min-height:96px;display:grid;place-items:center;overflow-x:auto;overflow-y:hidden;padding:6px 0}
.prob .f .katex-display{margin:0}
.prob .ask{color:var(--muted);font-size:16px;margin:-6px 0 0;text-align:center}
.panel .ptitle{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:18px;font-weight:700}
.panel .ptitle .katex{font-size:1.05em}
.prob button.go{justify-self:start;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.prob button.go[aria-expanded="true"],.prob button.go:hover{background:var(--brand);color:var(--brand-ink)}
.panel{margin-top:16px;border:1.5px solid var(--brand);border-radius:14px;padding:18px;background:var(--brand-soft2);display:grid;gap:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.mcard h3{font-family:var(--mono);font-size:18px;margin:0;color:var(--brand)}
.mcard p{font-size:14.5px;margin:0}
/* browse */
.browse{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px}
@media (max-width:860px){.browse{grid-template-columns:minmax(0,1fr);gap:18px}}
.side .lbl{font-size:13px;color:var(--muted);margin:0 0 8px 4px}
.side .list{display:grid;gap:4px;margin-bottom:26px}
.side button{all:unset;cursor:pointer;padding:10px 16px;border-radius:8px;font-size:16px}
.side button:hover{background:var(--brand-soft2)}
.side button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
.side button:focus-visible{outline:2px solid var(--brand)}
@media (max-width:860px){.side .list{display:flex;overflow-x:auto;gap:6px;margin-bottom:12px}.side button{white-space:nowrap;padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px}}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{display:grid;gap:8px;align-content:start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;transition:border-color .15s,box-shadow .15s;min-width:0}
.card:hover{border-color:var(--brand);box-shadow:0 6px 20px -12px rgba(16,137,70,.45)}
.card h3{font-size:19px;margin:2px 0 0}
.card .sub{color:var(--muted);font-size:14.5px}
.card .use{font-size:14.5px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
.tcard{display:grid;gap:4px;text-decoration:none;color:var(--ink);border-radius:10px;padding:14px 16px;background:var(--brand-soft2);border:1px solid var(--brand-soft)}
.tcard:hover{border-color:var(--brand)}
.tcard b{font-size:15.5px}
.tcard span{font-size:13px;color:var(--muted)}
.subh{font-size:14px;color:var(--muted);margin:0 0 10px;font-weight:500}
/* detail */
.page{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:48px;padding-block:32px 64px}
@media (max-width:980px){.page{grid-template-columns:minmax(0,1fr)}.rail{order:2}}
.page.one{grid-template-columns:minmax(0,1fr)}
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:10px;font-family:var(--mono)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--brand)}
.dh .sub{font-size:17px;color:var(--muted);margin-bottom:6px}
.s-h{display:flex;gap:10px;align-items:baseline;margin:40px 0 14px}
.s-h b{font-family:var(--mono);color:var(--brand);font-size:16px}
.s-h h2{margin:0;font-size:22px}
.codebox{background:var(--code);border-radius:12px;overflow:hidden;border:1px solid var(--code-line)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--code-line);font-size:12.5px;color:var(--code-muted);flex-wrap:wrap}
.codebox .bar .lbl{font-family:var(--mono);color:#9fb3c8}
.codebox .bar .lbl.ok{color:#6ee7a6}
.codebox .bar .lbl.ai{color:#fbbf77}
.codebox .bar button{border:1px solid var(--code-line);background:transparent;color:#cbd5e1;border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px}
pre{margin:0;overflow-x:auto;font-family:var(--mono);font-size:14px;line-height:1.7;tab-size:4}
pre.code{padding:14px 16px;color:var(--code-ink);counter-reset:ln}
pre.code .l{display:block;padding-left:2.6em;position:relative;min-height:1.7em;white-space:pre}
pre.code .l::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:1.8em;text-align:right;color:var(--code-muted)}
pre.out{padding:12px 16px;background:#111c30;color:#d6f5e3;border-top:1px dashed var(--code-line);white-space:pre}
pre.out.err{color:#ffb4a0}
pre.out::before{content:"출력";display:block;font-family:var(--sans);font-size:11px;color:var(--code-muted);margin-bottom:2px;letter-spacing:.08em}
.codebox .figs{background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--code-line)}
.codebox .figs img{max-height:260px;max-width:100%;width:auto}
pre .k{color:#c4a1ff}pre .s{color:#a5e8b8}pre .c{color:#64748b;font-style:italic}pre .nu{color:#ffc58a}pre .fn{color:#7dd3fc}
.info{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px 20px;align-items:start}
.info dt{color:var(--muted);font-size:14.5px;padding-top:3px}
.info dd{margin:0;font-weight:500}
@media (max-width:520px){.info{grid-template-columns:minmax(0,1fr);gap:4px}.info dd{margin-bottom:10px}}
.opts{display:grid;gap:6px}
.opts div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14.5px;font-weight:400}
.note{background:var(--brand-soft2);border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:16px 20px;font-size:16px}
.note.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.note b{display:block;font-size:13px;color:var(--brand);margin-bottom:2px}
.note.warn b{color:var(--warn)}
ul.guide{margin:0;padding-left:20px}
ul.guide li{margin-bottom:4px}
.rail{display:grid;gap:26px;align-content:start;position:sticky;top:84px}
@media (max-width:980px){.rail{position:static}}
.rail .lbl{font-size:13px;color:var(--muted);margin:0 0 10px}
.rail a.rel{display:block;text-decoration:none;color:var(--ink);border-left:3px solid var(--line);padding:2px 0 2px 14px;margin-bottom:14px}
.rail a.rel:hover{border-left-color:var(--brand)}
.rail a.rel b{display:block;font-weight:700;font-size:15.5px}
.rail a.rel span{font-size:13px;color:var(--muted)}
.ask{display:grid;gap:10px}
.askrow{display:flex;gap:8px;flex-wrap:wrap}
.askrow input{flex:1 1 260px;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.askrow input:focus{outline:none;border-color:var(--brand)}
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.55;cursor:default}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.presets button:hover{border-color:var(--brand);color:var(--brand)}
.also{margin-top:10px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.also b{display:block;font-size:13px;margin-bottom:6px}
.also a{display:inline-flex;gap:6px;margin:2px 10px 2px 0;text-decoration:none;color:var(--ink)}
.also a code{color:var(--brand)}
.status{font-size:14px;color:var(--muted)}
textarea.edit{display:block;width:100%;border:0;outline:0;resize:vertical;background:var(--code);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.7;padding:14px 16px;tab-size:4}
.codebox .bar button.runb{border-color:#2f6b4a;color:#9ff0c4}
.codebox .bar button.go{background:#108946;border-color:#108946;color:#fff;font-weight:700}
.codebox .live .bar{border-top:1px solid var(--code-line);border-bottom:0}
.codebox .live .figs{background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap}
.codebox .live img{max-height:300px;max-width:100%}
details.more>summary{list-style:none}details.more>summary::-webkit-details-marker{display:none}details[open].more>summary{display:none!important}
details.prep summary,details.pcode summary{cursor:pointer;font-size:13.5px;color:var(--brand);padding:6px 0}
/* topic */
.when{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.when li{border:1px solid var(--line);border-radius:10px;padding:9px 14px 9px 36px;position:relative}
.when li::before{content:"?";position:absolute;left:14px;top:9px;font-family:var(--mono);font-weight:700;color:var(--brand)}
.mbtns{display:flex;gap:10px;flex-wrap:wrap}
.mbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 20px;font-family:var(--mono);font-size:18px;font-weight:600;cursor:pointer;color:var(--ink)}
.mbtns button:hover{border-color:var(--brand)}
.mbtns button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.mdetail{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.mdetail dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 14px;margin:0}
.mdetail dt{color:var(--muted);font-size:14px}
.mdetail dd{margin:0}
.pit{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:14px 18px;margin:10px 0}
.pit h3{color:var(--warn);font-size:16px}
.pit p{margin:0 0 4px;font-size:15px}
/* lab */
.lab{border:1.5px solid var(--brand);border-radius:12px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;background:var(--surface)}
.lab-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.lab-h h3{margin:0}
.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:14px}
.controls label{display:flex;gap:8px;align-items:center}
.controls input[type=range]{width:min(260px,60vw);accent-color:var(--brand)}
.controls select,.controls button{font:inherit;font-size:14px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.controls button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
canvas.plot{width:100%;height:auto;aspect-ratio:16/9;background:var(--brand-soft2);border-radius:8px;display:block}
.readout{font-family:var(--mono);font-size:13.5px;background:var(--brand-soft2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.readout .hl{color:var(--warn);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--brand-soft2)}
tr:last-child td{border-bottom:0}
td.m{font-weight:600;white-space:nowrap}
/* tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:12px;padding-left:16px;border-left:1px solid var(--line)}
.tree li{position:relative;padding:3px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:16px;width:12px;border-top:1px solid var(--line)}
.tree summary{cursor:pointer;font-family:var(--mono);font-size:15px;list-style:none;display:inline-flex;gap:8px;align-items:center}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--brand);font-size:12px;transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary .cnt{font-family:var(--sans);font-size:12px;color:var(--muted)}
.tree .root>details>summary{font-size:18px;font-weight:700;color:var(--brand)}
.tree .leaves{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 4px}
.treegrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px}
@media (max-width:860px){.treegrid{grid-template-columns:minmax(0,1fr)}}
.foot{border-top:1px solid var(--line);margin-top:24px;padding-block:18px 40px;font-size:13px;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.dlg{padding:22px 24px;display:grid;gap:12px}
.dlg ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.dlg .x{justify-self:end;border:0;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.box h3{color:var(--brand)}
.box p{margin:0;font-size:15px}
.flash{box-shadow:0 0 0 3px var(--brand)}
/* 설정 */
.dlg h2{margin:0}
.set{display:grid;gap:16px}
.set .row{display:grid;gap:6px}
.set .row>span{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-size:14.5px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
.sw{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--brand)}
.dlg .acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.dlg .x.ghost{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
:root.noln pre.code .l{padding-left:0}:root.noln pre.code .l::before{display:none}
/* 자동완성 */
.sugwrap{position:relative;width:min(760px,100%)}
.sugwrap .searchbar{width:100%}
.sug{position:absolute;left:12px;right:12px;top:calc(100% + 4px);z-index:5;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -16px rgba(0,0,0,.35);text-align:left}
.sug li{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.sug li span{color:var(--muted);font-size:12.5px}
.sug li[aria-selected="true"],.sug li:hover{background:var(--brand-soft2);color:var(--brand)}
.fixnote{font-size:14px;color:var(--muted);text-align:center}
.fixnote b{color:var(--brand)}
/* 알고 가야 할 점 */
ul.know{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.know li{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:12px 16px}
ul.know b{display:block;color:var(--warn);font-size:15.5px;margin-bottom:2px}
ul.know p{margin:0;font-size:15px}
ul.know details summary{cursor:pointer;font-size:13.5px;color:var(--warn);margin-top:6px}
ul.know details .codebox{margin-top:8px}
.desc{font-size:16.5px;margin:14px 0 0}
.optt{margin-top:12px}
.optt td:first-child{white-space:nowrap}
.mdetail .codebox{margin-bottom:4px}
.mdetail .say{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.mdetail .say div{background:var(--brand-soft2);border-radius:10px;padding:10px 12px;font-size:14.5px}
.mdetail .say div b{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.mkrow{display:flex;gap:8px;flex-wrap:wrap}
.mkrow input{flex:1 1 260px;min-width:0;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.mkrow input:focus{outline:none;border-color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.mpad{width:min(760px,100%);margin-top:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 10px 30px -16px rgba(0,0,0,.25)}
.mpad[hidden]{display:none}
.mkeys{display:flex;flex-wrap:wrap;gap:6px}
.mkeys button{min-width:40px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mkeys button:hover{border-color:var(--brand);color:var(--brand)}
.mkeys button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mprev{display:flex;gap:10px;align-items:baseline;min-height:30px;font-size:18px;overflow-x:auto}
.mprev .lbl{font-size:12px;color:var(--muted);flex:none}
.mp{font-family:"Times New Roman",serif;white-space:nowrap}
.mp sup,.mp sub{font-size:.7em}
.mfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 2px}
.mfrac>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.mkeys .mfrac{font-size:.7em}
.ov{border-top:1px solid currentColor;padding-top:1px}
.mhint{margin:0;font-size:12.5px;color:var(--muted)}
.ask .mpad{width:100%}
.about{max-width:880px}
.ab-lead{font-size:19px;color:var(--muted);margin:10px 0 24px}
.ab-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:8px}
.ab-facts div{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--brand-soft2)}
.ab-facts b{display:block;font-size:30px;line-height:1.1;color:var(--brand)}
.ab-facts span{font-size:13.5px;color:var(--muted)}
.ab-h{margin:36px 0 14px;font-size:26px}
.ab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ab-card{border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.ab-card h3,.ab-steps h3{font-size:21px;margin:0 0 6px;color:var(--ink)}
.ab-card p,.ab-steps p{margin:0;font-size:14.5px;color:var(--muted)}
.ab-steps{list-style:none;counter-reset:st;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ab-steps li{counter-increment:st;border-top:3px solid var(--brand);padding:14px 4px 4px}
.ab-steps li::before{content:counter(st);display:block;font-family:var(--mono);font-size:13px;color:var(--brand);margin-bottom:4px}
@media (max-width:620px){.ab-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.ab-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.ab-h{font-size:22px}}

<script>
// 10개 분야 (2022 개정 교육과정 단원 순서). compare: [방법, 대표 코드, 결과 모양, 좋은 점, 한계]
const TOPICS = [
{
  n: 1, slug: "t1", title: "수와 식",
  ask: "정확한 값으로 계산하고, 식을 원하는 모양으로 바꾸고, 두 식이 같은지 확인하고 싶을 때",
  units: ["공통수학1: 다항식의 연산", "공통수학1: 나머지정리와 인수분해", "공통수학1: 복소수"],
  when: [
    "0.1 + 0.2가 0.3이 아니라고 나온다",
    "√(x²)가 x로 정리되지 않는다",
    "식을 전개·인수분해·통분·부분분수 중 원하는 모양으로 바꾸고 싶다",
    "다항식의 나머지나 최대공약수를 구하고 싶다",
    "두 식이 같은 식인지 확인하고 싶다",
    "x² − 5를 실수 범위에서 인수분해하고 싶다"
  ],
  compare: [
    ["파이썬 소수", "0.1 + 0.2 == 0.3", "False, 0.30000000000000004", "설치 없이 바로 계산", "소수 오차가 생긴다. √2를 제곱해도 2가 아니다"],
    ["Rational · sqrt", "Rational(1, 10)*3 == Rational(3, 10)", "True, 정확한 분수·무리수", "오차 없이 계산한다", "1/3처럼 쓰면 소수 0.333…이 된다"],
    ["가정 (positive)", "sqrt(p**2)  # p > 0", "p", "문자의 조건에 맞게 식이 정리된다", "가정을 주지 않으면 √(x²)를 그대로 둔다"],
    ["expand · factor", "factor(expand(f))", "전개식 ↔ 곱의 꼴", "서로 반대 방향으로 바꾼다", "factor 기본값은 유리수 범위"],
    ["simplify · cancel · apart", "apart(e)", "같은 식, 다른 모양", "원하는 모양을 골라 쓸 수 있다", "simplify가 어떤 모양을 줄지는 정할 수 없다"],
    ["collect", "collect(h, x)", "x에 대해 정리한 식", "한 문자에 대한 내림차순 정리", "인수분해는 하지 않는다"],
    ["gcd · div", "div(x**3 - 2*x + 5, x - 2, x)", "몫, 나머지", "다항식의 최대공약수와 나머지정리", "math.gcd는 정수만 받는다"],
    ["== · equals · simplify", "A.equals(B)", "True / False", "모양이 달라도 같은 식인지 판정한다", "==는 모양이 같은지만 본다. 가정이 없으면 equals도 판정을 못 한다"],
    ["factor 옵션", "factor(x**2 - 5, extension=[sqrt(5)])", "실수·복소수 범위의 인수분해", "범위를 직접 정한다", "domain='RR'·'CC'는 쪼개 주지 않는다"]
  ],
  verdict: "계산은 Rational·sqrt로 정확하게 하고, 문자에 조건이 있으면 가정(positive 등)을 붙인다. 식은 원하는 모양에 맞는 함수(expand·factor·cancel·apart·collect)로 바꾸고, 두 식이 같은지는 ==가 아니라 equals나 simplify(A − B)로 확인한다.",
  widget: "factor"
},
{
  n: 2, slug: "t2", title: "방정식과 부등식",
  ask: "방정식을 푸는데 solve, solveset, nsolve 중 무엇을 써야 할지 모를 때",
  units: ["공통수학1: 복소수와 이차방정식", "공통수학1: 여러 가지 방정식과 부등식", "대수: 지수함수와 로그함수"],
  when: [
    "중근이 몇 개인지까지 알고 싶다",
    "실수 해만 필요하다",
    "sin x = 0처럼 해가 무수히 많다",
    "sin x = x − π/2처럼 손으로 못 푸는 방정식이다",
    "연립방정식의 해가 없거나 무수히 많을 수 있다"
  ],
  compare: [
    ["solve", "solve(x**2 - 5*x + 6, x)", "리스트 [2, 3]", "가장 많이 쓰고, 복소수 해까지 준다", "해가 무수히 많아도 몇 개만 준다"],
    ["solveset", "solveset(sin(x), x, Interval(-2*pi, 2*pi))", "집합 {…}", "실수 범위·구간·부등식을 정할 수 있다", "못 풀면 오류 대신 조건만 남긴 ConditionSet"],
    ["roots", "roots((x - 1)**2*(x + 2), x)", "{근: 중복도}", "중근이 몇 개인지 알려 준다", "다항식만 된다"],
    ["부등식", "solveset(x**2 - x - 2 < 0, x, S.Reals)", "구간 (−1, 2)", "solve의 논리식보다 읽기 쉽다", "실수 범위를 꼭 정해야 한다"],
    ["nsolve", "nsolve(sin(x) - (x - pi/2), x, 2)", "근삿값 2.3098…", "손으로 못 푸는 방정식도 푼다", "초기값에 따라 다른 근이 나온다"],
    ["np.linspace", "k[np.argmin(np.abs(gk))]", "근삿값 2.31", "원리가 단순하다", "점 간격만큼만 정확하다"],
    ["linsolve", "linsolve(eqs, [x, y])", "집합 {(1 − y, y)}", "해가 없거나 무수히 많을 때도 분명하다", "일차 연립방정식만 된다"],
    ["nonlinsolve", "nonlinsolve(eqs, [x, y])", "집합 {(−2, −1), (1, 2)}", "이차 이상 연립방정식", "복잡하면 오래 걸린다"]
  ],
  verdict: "다항식은 solve, 중근 개수는 roots, 실수 해·구간·부등식·무수히 많은 해는 solveset, 손으로 못 푸는 방정식은 그래프로 근 근처를 확인한 뒤 nsolve를 쓴다. 연립방정식은 해가 없거나 무수히 많을 수 있으면 linsolve가 결과를 더 분명하게 보여 준다.",
  widget: "newton"
},
{
  n: 3, slug: "t3", title: "경우의 수",
  ask: "팩토리얼·조합 값을 구하거나, 조건이 있는 경우를 직접 세어 보거나, n이 문자인 식으로 정리하고 싶을 때",
  units: ["공통수학1: 경우의 수"],
  when: [
    "5!, ₆C₂ 같은 값을 빨리 구하고 싶다",
    "ₙC₂를 n에 대한 식으로 쓰고 싶다",
    "n!/(n − 2)!을 간단히 하고 싶다",
    "'이웃하지 않게' 같은 조건이 있는 경우를 직접 세어 공식과 맞춰 보고 싶다",
    "ₙC₂ = 28을 만족하는 n을 구하고 싶다",
    "약수의 개수를 구하고 싶다"
  ],
  compare: [
    ["math.factorial · math.comb", "math.factorial(5)", "정수 120", "설치 없이 바로 계산", "n이 문자이면 쓸 수 없다"],
    ["factorial · binomial", "binomial(6, 2)", "정수 15", "같은 값을 SymPy 식으로 다룬다", "그대로는 binomial(n, 2)로 남는다"],
    ["expand_func", "expand_func(binomial(n, 2))", "n(n − 1)/2", "n에 대한 식으로 펼친다", "직접 불러야 펼쳐진다"],
    ["simplify", "simplify(factorial(n)/factorial(n - 2))", "n(n − 1)", "순열 ₙPᵣ을 식으로 정리한다", "n이 정수라는 가정이 필요하다"],
    ["itertools (다 세기)", "sum(1 for p in permutations(people) if apart(p))", "72 (공식 3!·₄P₂와 같다)", "조건을 그대로 코드로 옮겨 공식을 확인한다", "경우가 많으면 느리다 (₂₆C₁₃ 나열에 약 0.7초)"],
    ["scipy.special.comb", "comb(60, 30)", "1.18…e+17 (실제보다 16 작다)", "NumPy 배열을 한꺼번에 계산한다", "기본값이 소수라 큰 수가 틀린다, exact=True 필요"],
    ["solve + 자연수 가정", "solve(expand_func(binomial(m, 2)) - 28, m)", "[−7, 8] → 가정하면 [8]", "ₘC₂ = 28 같은 방정식을 푼다", "가정이 없으면 음수 해도 나온다"],

{ k: "Poly", n: "Poly", lib: "sympy", path: ["polys", "polytools"], d: "식을 다항식 객체로 만든다. 계수와 차수를 다룰 때 쓴다.", use: "Poly(x**3 - 6*x**2 + 11*x - 6, x).degree()", out: "3" },
{ k: "nroots", n: "nroots", lib: "sympy", path: ["polys", "polytools"], d: "다항식의 모든 근을 소수 근삿값으로 구한다(복소근 포함).", use: "nroots(x**3 + x - 1)", out: "[0.682327803828019, -0.341… - 1.161…*I, -0.341… + 1.161…*I]" },
{ k: "real_roots", n: "real_roots", lib: "sympy", path: ["polys", "polytools"], d: "다항식의 실근만 정확한 값으로 구한다.", use: "real_roots(x**3 + x - 1)", out: "[CRootOf(x**3 + x - 1, 0)]" },
{ k: "roots", n: "roots", lib: "sympy", path: ["polys", "polyroots"], d: "다항방정식의 근과 중복도(몇 중근인지)를 함께 준다.", use: "roots(x**3 - 3*x + 2)", out: "{-2: 1, 1: 2}   # 1이 중근", pat: "(?<![\\w.])roots\\(" },
{ k: "together", n: "together", lib: "sympy", path: ["polys", "rationaltools"], d: "분수식을 통분해 하나의 분수로 만든다.", use: "together(1/x + 1/(x + 1))", out: "(2*x + 1)/(x*(x + 1))" },
{ k: "apart", n: "apart", lib: "sympy", path: ["polys", "partfrac"], d: "분수식을 부분분수로 나눈다. 합을 구하기 전에 쓰면 좋다.", use: "apart(1/(k*(k + 1)))", out: "-1/(k + 1) + 1/k" },
// ---------- SymPy: simplify ----------
{ k: "simplify", n: "simplify", lib: "sympy", path: ["simplify", "simplify"], d: "식을 가장 간단해 보이는 모양으로 정리한다.", use: "simplify(sin(x)**2 + cos(x)**2)", out: "1", warn: "어떤 모양으로 나올지 정할 수 없다. 공식이 맞는지는 simplify(좌변 − 우변)이 0인지로 확인한다." },
{ k: "nsimplify", n: "nsimplify", lib: "sympy", path: ["simplify", "simplify"], d: "소수 근삿값을 가까운 정확한 수(분수, 제곱근 등)로 바꿔 본다.", use: "nsimplify(2.00000000000000)\nnsimplify(0.333333333333333)", out: "2\n1/3", warn: "추측일 뿐이다. 간단한 수가 아닌 근(2.30988…)을 넣으면 의미 없는 큰 분수가 나온다." },
{ k: "trigsimp", n: "trigsimp", lib: "sympy", path: ["simplify", "trigsimp"], d: "삼각함수 식을 공식으로 모아 간단히 한다(합성 포함).", use: "trigsimp(sqrt(3)*sin(a) + cos(a))", out: "2*sin(a + pi/6)", warn: "tan a + cot a처럼 줄이지 못하는 식이 있다. 그때는 TR2 → together → trigsimp 순서로 직접 지정한다." },
{ k: "fu", n: "fu", lib: "sympy", path: ["simplify", "fu"], d: "삼각함수 식을 여러 규칙으로 바꿔 보고 가장 짧은 모양을 고른다.", use: "fu(sqrt(3)*sin(a) + cos(a))", out: "2*sin(a + pi/6)", pat: "(?<![\\w.])fu\\(" },
{ k: "TR", n: "TR2 · TR7 · TR8 · TR9", lib: "sympy", path: ["simplify", "fu"], d: "fu 안의 규칙 하나만 골라 적용한다. TR2는 tan·cot을 sin/cos로, TR7은 cos²의 차수를 낮추고, TR8은 곱을 합으로, TR9는 합을 곱으로 바꾼다.", use: "from sympy.simplify.fu import TR9\nTR9(sin(a) + sin(b))", out: "2*sin(a/2 + b/2)*cos(a/2 - b/2)", pat: "\\bTR\\d+\\(" },
// ---------- SymPy: solvers ----------
{ k: "solve", n: "solve", lib: "sympy", path: ["solvers", "solvers"], d: "방정식을 풀어 해를 리스트로 준다.", use: "solve(x**2 - 5*x + 6, x)", out: "[2, 3]", warn: "복소수 해까지 준다. sin x = 0처럼 해가 무수히 많아도 [0, pi]만 준다. 실수 해, 구간 안의 해는 solveset으로 구한다." },
{ k: "nsolve", n: "nsolve", lib: "sympy", path: ["solvers", "solvers"], d: "초기값에서 출발해 근의 근삿값을 찾는다. 손으로 풀 수 없는 방정식에 쓴다.", use: "nsolve(sin(x) - x + pi/2, x, 2)", out: "2.30988146001006", opts: [["세 번째 값", "초기값. 찾고 싶은 근 가까이 준다"]], warn: "초기값에 따라 다른 근이 나온다. 그래프로 근의 위치를 먼저 본다." },
{ k: "solveset", n: "solveset", lib: "sympy", path: ["solvers", "solveset"], d: "방정식이나 부등식을 풀어 해를 집합으로 준다. 해를 찾을 범위를 정할 수 있다.", use: "solveset(x**2 - 1 > 0, x, S.Reals)", out: "Union(Interval.open(-oo, -1), Interval.open(1, oo))", opts: [["domain=S.Reals", "실수 해만"], ["domain=Interval(0, 2*pi)", "구간 안의 해만"]], warn: "풀 수 없으면 오류 대신 ConditionSet(조건만 남은 집합)을 준다." },
{ k: "linsolve", n: "linsolve", lib: "sympy", path: ["solvers", "solveset"], d: "연립일차방정식을 풀어 해를 집합으로 준다.", use: "linsolve([x + y - 3, x - y - 1], x, y)", out: "{(2, 1)}", warn: "해가 없으면 EmptySet을 준다(solve는 빈 리스트)." },
{ k: "nonlinsolve", n: "nonlinsolve", lib: "sympy", path: ["solvers", "solveset"], d: "이차 이상의 식이 섞인 연립방정식을 푼다.", use: "nonlinsolve([x**2 + y**2 - 5, x - y - 1], x, y)", out: "{(-1, -2), (2, 1)}" },
{ k: "rsolve", n: "rsolve", lib: "sympy", path: ["solvers", "recurr"], d: "점화식을 풀어 일반항을 구한다.", use: "f = Function('f')\nrsolve(f(n+1) - 2*f(n) - 3, f(n), {f(0): 1})", out: "4*2**n - 3", warn: "aₙ₊₁ = aₙ² 같은 비선형 점화식은 풀지 못한다. aₙ₊₁ = 2ⁿaₙ은 cₙ = log₂aₙ으로 바꾸면 풀린다." },
{ k: "decompogen", n: "decompogen · compogen", lib: "sympy", path: ["solvers", "decompogen"], d: "식이 어떤 함수들의 합성인지 나눠 보여 준다. compogen은 다시 합성한다. 치환할 식을 찾을 때 참고한다.", use: "decompogen(exp(2*x) - exp(x), x)", out: "[x**2 - x, exp(x)]", warn: "3^(2x) − 6·3^x − 27은 다시 합성하면 540이 되는 틀린 분해를 냈다. 3^x = t 치환은 직접 하는 편이 안전하다.", pat: "\\b(de)?compogen\\(" },
// ---------- SymPy: sets ----------
{ k: "Interval", n: "Interval", lib: "sympy", path: ["sets", "sets"], d: "구간을 만든다. solveset, minimum 등에 범위로 넣는다.", use: "Interval(0, 1)        # [0, 1]\nInterval.open(0, 1)   # (0, 1)", pat: "\\bInterval(\\.open)?\\(" },
// ---------- SymPy: matrices ----------
{ k: "Matrix", n: "Matrix", lib: "sympy", path: ["matrices", "dense"], d: "행렬을 만든다. 성분이 분수나 문자여도 정확하게 계산한다.", use: "A = Matrix([[1, 2], [3, 4]])\nA * A", out: "Matrix([[7, 10], [15, 22]])", warn: "SymPy에서 *는 행렬곱이다. NumPy의 *는 성분끼리의 곱이라 다르다." },
{ k: "det", n: ".det()", lib: "sympy", path: ["matrices", "matrixbase"], d: "행렬식을 구한다.", use: "Matrix([[1, 2], [3, 4]]).det()", out: "-2", pat: "(?<!linalg)\\.det\\(|(?<![\\w.])det\\(" },
{ k: "inv", n: ".inv()", lib: "sympy", path: ["matrices", "matrixbase"], d: "역행렬을 정확한 값으로 구한다.", use: "Matrix([[1, 2], [3, 4]]).inv()", out: "Matrix([[-2, 1], [3/2, -1/2]])", warn: "행렬식이 0이면 오류가 난다.", pat: "(?<!linalg)\\.inv\\(|(?<![\\w.])inv\\(" },
{ k: "eigenvals", n: ".eigenvals()", lib: "sympy", path: ["matrices", "matrixbase"], d: "고윳값을 구한다(교육과정 밖, 심화).", use: "Matrix([[2, 1], [1, 2]]).eigenvals()", out: "{3: 1, 1: 1}", pat: "\\.eigenvals\\(" },
{ k: "LUsolve", n: ".LUsolve()", lib: "sympy", path: ["matrices", "matrixbase"], d: "행렬방정식 AX = B를 풀어 X를 구한다.", use: "A = Matrix([[1, 2], [3, 4]])\nA.LUsolve(Matrix([3, 7]))", out: "Matrix([[1], [1]])", pat: "\\.LUsolve\\(" },
// ---------- SymPy: plotting ----------
{ k: "plot", n: "plot", lib: "sympy", path: ["plotting", "plot"], d: "y = f(x)의 그래프를 그린다.", use: "plot(x**2 - 3*x + 1, (x, -2, 4))", pat: "(?<![\\w.])plot\\(" },
{ k: "plot_implicit", n: "plot_implicit", lib: "sympy", path: ["plotting", "plot_implicit"], d: "x, y가 섞인 식(음함수)의 그래프를 그린다.", use: "plot_implicit(Eq(x**2 + y**2, 1))", warn: "adaptive=False를 주면 원래 곡선이 아닌 부분까지 그려졌다." },
{ k: "plot_parametric", n: "plot_parametric", lib: "sympy", path: ["plotting", "plot"], d: "매개변수 t로 나타낸 곡선을 그린다.", use: "plot_parametric((cos(t), sin(t)), (t, 0, 2*pi))" },
// ---------- SymPy: utilities ----------
{ k: "lambdify", n: "lambdify", lib: "sympy", path: ["utilities", "lambdify"], d: "SymPy 식을 NumPy로 빠르게 계산하는 함수로 바꾼다. 그래프를 그리거나 수치 계산을 할 때 쓴다.", use: "f_np = lambdify(x, x**2 - 3*x + 1, 'numpy')\nf_np(np.linspace(0, 1, 5))" },
// ---------- NumPy ----------
{ k: "np.linspace", n: "np.linspace", lib: "numpy", path: ["numpy"], d: "구간을 같은 간격으로 나눈 점들을 만든다. 넓이 근사, 그래프에 쓴다.", use: "np.linspace(0, np.pi, 5)   # 점 5개 = 구간 4개", out: "[0.     0.785  1.571  2.356  3.142]", warn: "점 개수는 구간 개수 + 1이다. 점이 너무 적으면 그래프 모양이 틀어진다.", pat: "linspace\\(" },
{ k: "np.trapezoid", n: "np.trapezoid", lib: "numpy", path: ["numpy"], d: "점들의 함숫값으로 사다리꼴 공식 넓이를 구한다.", use: "xs = np.linspace(0, np.pi, 5)\nnp.trapezoid(np.sin(xs), xs)", out: "1.8961188979370398", pat: "trapezoid\\(" },
{ k: "np.array", n: "np.array", lib: "numpy", path: ["numpy"], d: "NumPy 배열(행렬)을 만든다. 소수로 빠르게 계산한다.", use: "A = np.array([[1, 2], [3, 4]])\nA @ A   # 행렬곱", out: "[[ 7 10]\n [15 22]]", warn: "*는 같은 자리 성분끼리의 곱이다. 행렬곱은 @를 쓴다.", pat: "np\\.array\\(" },
{ k: "np.linalg", n: "np.linalg (det · inv · solve)", lib: "numpy", path: ["numpy", "linalg"], d: "NumPy 행렬의 행렬식, 역행렬, 연립방정식 풀이.", use: "np.linalg.det(np.array([[1, 2], [3, 4]]))", out: "-2.0000000000000004", warn: "소수 오차가 섞인다. 힐베르트 행렬처럼 역행렬이 거의 없는 행렬에서는 크게 틀린다.", pat: "np\\.linalg\\." },
{ k: "np.roots", n: "np.roots", lib: "numpy", path: ["numpy"], d: "다항식의 계수를 넣으면 근을 소수로 구한다.", use: "np.roots([1, -5, 6])", out: "[3. 2.]", pat: "np\\.roots\\(" },
// ---------- SciPy ----------
{ k: "simpson", n: "simpson", lib: "scipy", path: ["scipy", "integrate"], d: "점들의 함숫값으로 심프슨 공식 넓이를 구한다(심화). 같은 점 개수에서 사다리꼴보다 훨씬 정확하다.", use: "from scipy.integrate import simpson\nsimpson(np.sin(xs), x=xs)", out: "2.0045597549844207", warn: "구간 개수가 짝수일 때 교과서의 심프슨 공식과 같다." },
{ k: "quad", n: "quad", lib: "scipy", path: ["scipy", "integrate"], d: "함수를 넣으면 정적분의 근삿값과 오차 추정을 준다.", use: "from scipy.integrate import quad\nquad(np.sin, 0, np.pi)", out: "(2.0, 2.220446049250313e-14)" },
{ k: "minimize_scalar", n: "minimize_scalar", lib: "scipy", path: ["scipy", "optimize"], d: "함수의 극소점을 수치로 찾는다.", use: "minimize_scalar(f_np, bounds=(-3, 3), method='bounded')", warn: "극소점에 머물러 끝점에서의 최솟값을 놓칠 수 있다. 끝점의 값과 꼭 비교한다." },
{ k: "hilbert", n: "hilbert", lib: "scipy", path: ["scipy", "linalg"], d: "힐베르트 행렬을 만든다. 소수 계산의 오차를 보여 주는 예로 쓴다.", use: "from scipy.linalg import hilbert\nhilbert(3)" },
// ---------- Matplotlib ----------
{ k: "plt.plot", n: "plt.plot", lib: "matplotlib", path: ["pyplot"], d: "점들을 선으로 이어 그래프를 그린다.", use: "plt.plot(xs, np.sin(xs))\nplt.show()", pat: "plt\\.plot\\(" },
{ k: "polar", n: "극좌표 그래프", lib: "matplotlib", path: ["pyplot"], d: "극방정식 r = f(θ)의 그래프를 그린다(교육과정 밖, 심화).", use: "ax = plt.subplot(projection='polar')\nax.plot(theta, 1 + np.cos(theta))", pat: "polar" },
{ k: "plt.fill_between", n: "plt.fill_between", lib: "matplotlib", path: ["pyplot"], d: "그래프와 x축 사이를 색칠해 넓이를 보여 준다.", use: "plt.fill_between(xs, np.sin(xs), alpha=0.3)", pat: "fill_between\\(" },
// ---------- 새 분야(수와 식·경우의 수)에서 쓰는 함수 ----------
{ k: "math.sqrt", n: "math.sqrt", lib: "python", path: ["math"], d: "제곱근을 소수로 구한다.", use: "import math\nmath.sqrt(2)", out: "1.4142135623730951", warn: "음수를 넣으면 오류(math domain error)가 난다. SymPy의 sqrt(-1)은 I를 준다.", pat: "math\\.sqrt" },
{ k: "math.comb", n: "math.comb · factorial · gcd", lib: "python", path: ["math"], d: "조합·팩토리얼·최대공약수를 정수로 구한다.", use: "import math\nmath.comb(6, 2), math.factorial(5), math.gcd(12, 18)", out: "(15, 120, 6)", warn: "정수만 받는다. n이 문자이면 SymPy의 binomial·factorial, 다항식의 최대공약수는 gcd.", pat: "math\\.(comb|factorial|gcd)" },
{ k: "refine", n: "refine · ask", lib: "sympy", path: ["assumptions"], d: "가정을 나중에 붙여 식을 정리하거나(refine), 성질이 참인지 묻는다(ask).", use: "refine(sqrt(x**2), Q.positive(x))\nask(Q.positive(x**2), Q.real(x) & Q.nonzero(x))", out: "x\nTrue", warn: "ask는 판단할 수 없으면 None을 준다. 예: x가 실수라는 것만으로는 x² > 0을 말할 수 없다(x = 0).", pat: "\\b(refine|ask)\\(" },
{ k: "expand_log", n: "expand_log", lib: "sympy", path: ["core", "function"], d: "로그 법칙으로 log(ab)를 log a + log b로 펼친다.", use: "a, b = symbols('a b', positive=True)\nexpand_log(log(a*b))", out: "log(a) + log(b)", warn: "문자가 양수라는 가정이 없으면 펼치지 않는다.", pat: "expand_log\\(" },
{ k: "cancel", n: "cancel", lib: "sympy", path: ["polys", "polytools"], d: "유리식의 분자·분모를 약분해 (다항식)/(다항식) 꼴로 만든다.", use: "cancel((x**2 - 1)/(x**2 + 2*x + 1))", out: "(x - 1)/(x + 1)", pat: "(?<![\\w.])cancel\\(" },
{ k: "collect", n: "collect", lib: "sympy", path: ["simplify", "radsimp"], d: "한 문자에 대해 같은 차수끼리 모아 정리한다.", use: "collect(x**2*y + x**2 + 2*x*y + x + y, x)", out: "x**2*(y + 1) + x*(2*y + 1) + y", pat: "(?<![\\w.])collect\\(" },
{ k: "gcd", n: "gcd", lib: "sympy", path: ["polys", "polytools"], d: "정수뿐 아니라 다항식의 최대공약수도 구한다.", use: "gcd(x**2 - 1, x**2 + 2*x + 1)", out: "x + 1", pat: "(?<![\\w.])gcd\\(" },
{ k: "div", n: "div", lib: "sympy", path: ["polys", "polytools"], d: "다항식의 나눗셈. (몫, 나머지)를 준다.", use: "div(x**3 - 2*x + 5, x - 2, x)", out: "(x**2 + 2*x + 2, 9)", pat: "(?<![\\w.])div\\(" },
{ k: "srepr", n: "srepr", lib: "sympy", path: ["printing", "repr"], d: "식이 컴퓨터 안에서 어떤 구조로 저장되는지 보여 준다.", use: "print(srepr((x + 1)**2))", out: "Pow(Add(Symbol('x'), Integer(1)), Integer(2))", pat: "srepr\\(" },
{ k: "factorial", n: "factorial", lib: "sympy", path: ["functions", "combinatorial"], d: "n!을 계산한다. n이 문자여도 된다.", use: "factorial(5)", out: "120", pat: "(?<![\\w.])factorial\\(" },

rt(100*x))\nprint(solve(g_x, x))\nprint(nsimplify(nsolve(g_x, x, 8)), nsimplify(nsolve(g_x, x, 0.2)))", "output": "2.00000000000000 2\n[10, 10**(1/3)/10]\n10 10**(1/3)/10", "error": null, "prep": null, "ord": 55}, {"id": "2-125", "topic": 2, "title": "nsimplify 는 '깔끔한 수'일 때만 통한다", "code": "r = nsolve(sin(x) - (x - pi/2), x, 2)\nprint(r, '→', nsimplify(r))", "output": "2.30988146001006 → 115494073000503/50000000000000", "error": null, "prep": null, "ord": 56}, {"id": "2-126", "topic": 2, "title": "decompogen : 식의 합성 구조 보기 (3^x 에서는 틀린 분해)", "code": "from sympy.solvers.decompogen import compogen\nd = decompogen(3**(2*x) - 6*3**x - 27, x)\nprint(d, '→ 다시 합성하면', compogen(d, x))\nd2 = decompogen(exp(2*x) - exp(x), x)\nprint(d2, '→ 다시 합성하면', compogen(d2, x))", "output": "[x**2 - 6*x - 27, x**x, 3] → 다시 합성하면 540\n[x**2 - x, exp(x)] → 다시 합성하면 exp(2*x) - exp(x)", "error": null, "prep": null, "ord": 57}, {"id": "3-0", "topic": 3, "title": "[3] 준비", "code": "from sympy import *\nimport math\nn = symbols('n', integer=True, positive=True)", "output": "", "error": null, "prep": null, "ord": 58}, {"id": "3-1", "topic": 3, "title": "팩토리얼 : math vs sympy", "code": "print(math.factorial(5), factorial(5))\nprint(factorial(n))", "output": "120 120\nfactorial(n)", "error": null, "prep": "3-0", "ord": 59}, {"id": "3-2", "topic": 3, "title": "조합 : math.comb vs binomial", "code": "print(math.comb(6, 2), binomial(6, 2))", "output": "15 15", "error": null, "prep": "3-0", "ord": 60}, {"id": "3-3", "topic": 3, "title": "n 이 문자일 때 : binomial 만 가능", "code": "print(binomial(n, 2))\nprint(expand_func(binomial(n, 2)))", "output": "binomial(n, 2)\nn*(n - 1)/2", "error": null, "prep": "3-0", "ord": 61}, {"id": "3-4", "topic": 3, "title": "순열 nPr = n!/(n-r)! 을 문자로", "code": "print(simplify(factorial(n)/factorial(n - 2)))", "output": "n*(n - 1)", "error": null, "prep": "3-0", "ord": 62}, {"id": "3-5", "topic": 3, "title": "조건이 있는 순열 : 다 세기(itertools) vs 공식", "code": "from itertools import permutations\npeople = ['남1', '남2', '남3', '여1', '여2']\ndef apart(p):   # 여자끼리 이웃하지 않으면 True\n    return abs(p.index('여1') - p.index('여2')) > 1\ncnt = sum(1 for p in permutations(people) if apart(p))\nprint(cnt, math.factorial(3) * math.perm(4, 2))   # 다 세기, 공식 3!·4P2\nprint(120 - cnt, math.factorial(4) * 2)          # 이웃하는 경우, 공식 4!·2!", "output": "72 72\n48 48", "error": null, "prep": "3-0", "ord": 62.1}, {"id": "3-6", "topic": 3, "title": "다 세기의 한계 : 26C13 나열 vs math.comb", "code": "import time\nfrom itertools import combinations\nt0 = time.time()\ncnt = sum(1 for _ in combinations(range(26), 13))\nt1 = time.time()\nprint(cnt, math.comb(26, 13))\nprint('다 세는 데', round(t1 - t0, 2), '초')", "output": "10400600 10400600\n다 세는 데 0.78 초", "error": null, "prep": "3-0", "ord": 62.2}, {"id": "3-7", "topic": 3, "title": "m(m−1)=30, mC2=28 : 가정 없음 vs 자연수 가정", "code": "m = symbols('m')\nprint(solve(m*(m - 1) - 30, m), solve(expand_func(binomial(m, 2)) - 28, m))\nm = symbols('m', integer=True, positive=True)\nprint(solve(m*(m - 1) - 30, m), solve(expand_func(binomial(m, 2)) - 28, m))", "output": "[-5, 6] [-7, 8]\n[6] [8]", "error": null, "prep": "3-0", "ord": 62.300000000000004}, {"id": "3-8", "topic": 3, "title": "nCr = nC(n−r), 파스칼 법칙 : 대입 확인 vs 기호 증명", "code": "print(all(math.comb(a, b) == math.comb(a, a - b) for a in range(1, 30) for b in range(a + 1)))\nr = symbols('r', integer=True, nonnegative=True)\nprint(simplify(binomial(n, r) - binomial(n, n - r)))\nprint(simplify(binomial(n, r) + binomial(n, r + 1) - binomial(n + 1, r + 1)))", "output": "True\n0\n0", "error": null, "prep": "3-0", "ord": 62.4}, {"id": "3-9", "topic": 3, "title": "큰 조합 : math.comb vs scipy comb(기본값은 소수)", "code": "from scipy.special import comb\nprint(math.comb(60, 30))\nprint(comb(60, 30))\nprint(comb(60, 30, exact=True))\nprint(int(comb(60, 30)) - math.comb(60, 30))", "output": "118264581564861424\n1.182645815648614e+17\n118264581564861424\n-16", "error": null, "prep": "3-0", "ord": 62.5}, {"id": "3-10", "topic" )", "output": "", "error": null, "prep": "5-0b", "ord": 111}, {"id": "5-0c", "topic": 5, "title": "[5] 준비 (도형의 방정식)", "code": "from sympy import *\nfrom sympy.geometry import Point, Line, Circle\nimport math\nimport numpy as np\nx, y = symbols('x y')", "output": "", "error": null, "prep": null, "ord": 111.05}, {"id": "5-26", "topic": 5, "title": "두 점을 지나는 직선 : 기울기 공식 vs Line (수직선)", "code": "P, Q = (2, 1), (2, 5)\ntry:\n    m = (Q[1] - P[1]) / (Q[0] - P[0])\nexcept ZeroDivisionError as e:\n    print('기울기 공식:', e)\nprint(Line(Point(*P), Point(*Q)).equation())\nprint(Line(Point(1, 2), Point(3, 8)).equation())", "output": "기울기 공식: division by zero\nx - 2\n-6*x + 2*y + 2", "error": null, "prep": "5-0c", "ord": 111.1}, {"id": "5-27", "topic": 5, "title": "수직 판정 : 실수 기울기의 곱 vs is_perpendicular", "code": "m1, m2 = 1/49, -49\nprint(m1 * m2, m1 * m2 == -1)\nprint((0.3 - 0) / (3 - 0) == 0.1)\nl1, l2 = Line(Point(0, 0), Point(49, 1)), Line(Point(0, 0), Point(-1, 49))\nprint(l1.is_perpendicular(l2))", "output": "-0.9999999999999999 False\nFalse\nTrue", "error": null, "prep": "5-0c", "ord": 111.19999999999999}, {"id": "5-28", "topic": 5, "title": "점과 직선 : 거리 공식 vs Line.distance, 점이 직선 위에?", "code": "print(abs(1 + 1 - 1) / math.sqrt(2), Line(x + y - 1).distance(Point(1, 1)))\nprint(3 * 0.1 == 0.3, Line(y - 3*x).contains(Point(Rational(1, 10), Rational(3, 10))))", "output": "0.7071067811865475 sqrt(2)/2\nFalse True", "error": null, "prep": "5-0c", "ord": 111.3}, {"id": "5-29", "topic": 5, "title": "원의 중심·반지름 : 공식 vs Circle (원이 아닌 식)", "code": "for e in [x**2 + y**2 - 4*x + 6*y - 3, x**2 + y**2 + 2*x + 5]:\n    D, E, F = e.coeff(x, 1), e.coeff(y, 1), e.subs({x: 0, y: 0})\n    print('공식 r² =', (D**2 + E**2 - 4*F) / 4)\n    try:\n        c = Circle(e)\n        print('Circle:', c.center, c.radius)\n    except Exception as er:\n        print('Circle:', type(er).__name__, er)", "output": "공식 r² = 16\nCircle: Point2D(2, -3) 4\n공식 r² = -4\nCircle: GeometryError Circle with imaginary radius is not permitted", "error": null, "prep": "5-0c", "ord": 111.39999999999999}, {"id": "5-30", "topic": 5, "title": "세 점을 지나는 원 : Circle vs solve vs NumPy (일직선 세 점)", "code": "a, b, c = symbols('a b c')\nfor pts in [[(0, 0), (4, 0), (0, 2)], [(0, 0), (1, 1), (2, 2)]]:\n    print(Circle(*[Point(*p) for p in pts]))\n    print(solve([X**2 + Y**2 + a*X + b*Y + c for X, Y in pts], [a, b, c]))\n    try:\n        print(np.linalg.solve([[X, Y, 1] for X, Y in pts], [-(X**2 + Y**2) for X, Y in pts]))\n    except Exception as er:\n        print(type(er).__name__, er)", "output": "Circle(Point2D(2, 1), sqrt(5))\n{a: -4, b: -2, c: 0}\n[-4. -2.  0.]\nSegment2D(Point2D(0, 0), Point2D(2, 2))\n[]\nLinAlgError Singular matrix", "error": null, "prep": "5-0c", "ord": 111.5}, {"id": "5-31", "topic": 5, "title": "원과 직선의 위치 관계 : 판별식 vs 거리 vs intersection", "code": "k = symbols('k', real=True)\nprint(factor(discriminant(expand(x**2 + (2*x + k)**2 - 5), x)))\nprint(solve(Eq(Abs(k) / sqrt(5), sqrt(5)), k))\nC = Circle(Point(0, 0), sqrt(5))\nfor kk in [5, 1, 6]:\n    print(kk, C.intersection(Line(y - 2*x - kk)))", "output": "-4*(k - 5)*(k + 5)\n[-5, 5]\n5 [Point2D(-2, 1)]\n1 [Point2D(-2/5 + 2*sqrt(6)/5, 1/5 + 4*sqrt(6)/5), Point2D(-2*sqrt(6)/5 - 2/5, 1/5 - 4*sqrt(6)/5)]\n6 []", "error": null, "prep": "5-0c", "ord": 111.6}, {"id": "5-32", "topic": 5, "title": "원 밖의 점에서 그은 접선 : 판별식 vs tangent_lines", "code": "m = symbols('m')\nprint(solve(discriminant(expand(x**2 + (m*(x - 5) + 3)**2 - 25), x), m))\nprint([l.equation() for l in Circle(Point(0, 0), 5).tangent_lines(Point(5, 3))])", "output": "[-8/15]\n[x - 5, -24*x/17 - 45*y/17 + 15]", "error": null, "prep": "5-0c", "ord": 111.69999999999999}, {"id": "6-0", "topic": 6, "title": "[6] 준비", "code": "from sympy import *\nfrom sympy.simplify.fu import TR2, TR7, TR8, TR9\na, b = symbols('a b')", "output": "", "error": null, "prep": null, "ord": 112}, {"id": "6-1", "topic": 6, "title": "펼치기 : expand_trig", "code": "print(expand_trig(sin(a+b)))\nprint(expand_trig(cos(2*a)))\nprint(expand_trig(tan(a+b)))", "output": "sin(a)*cos(b) + sin(b)*cos(a)\n2*cos(a)**2 - 1\n(tan(a) + tan(b))/(-tan(a)*tan(b) + 1)", "error": null, "prep": "6-0", "ord": 113}, {"id": "6-2", "topic": 6, "title": "펼치기 : expand(trig=True)", "code": "print(expand(sin(a+b), trig=True))\nprint(expand(cos(2*a), trig=True))\nprint(expand(tan(a+b), trig=True))", "output": "sin(a)*cos(b) + sin(b)*cos(a)\n2*cos(a)**2 - 1\ntan(a)/(-tan(a)*tan(b) + 1) + tan(b)/(-tan(a)*tan(b) + 1)", "error": null, "prep": "6-0", "ord": 114}, {"id": "6-3", "topic": 6, "title": "모으기 : 합성", "code": "e = sqrt(3)*sin(a) + cos(a)\nprint(trigsimp(e))\nprint(simplify(e))\nprint(fu(e))", "output": "2*sin(a + pi/6)\n2*sin(a + pi/6)\n2*sin(a + pi/6)", "error": null, "prep": "6-0", "ord": 115}, {"id": "6-4", "topic": 6, "title": "모으기 : cos⁴ - sin⁴", "code": "e = cos(a)**4 - sin(a)**4\nprint(trigsimp(e))\nprint(simplify(e))\nprint(fu(e))", "output": "cos(2*a)\ncos(2*a)\ncos(2*a)", "error": null, "prep": "6-0", "ord": 116}, {"id": "6-5", "topic": 6, "title": "셋 다 못 줄이는 식", "code": "e = tan(a) + cot(a)\nprint(trigsimp(e))\nprint(simplify(e))\nprint(fu(e))", "output": "tan(a) + cot(a)\ntan(a) + cot(a)\ntan(a) + cot(a)", "error": null, "prep": "6-0", "ord": 117}, {"id": "6-6", "topic": 6, "title": "단계를 지정하면 풀림", "code": "s1 = TR2(e)\ns2 = together(s1)\nprint(s1, '→', s2, '→', trigsimp(s2))", "output": "sin(a)/cos(a) + cos(a)/sin(a) → (sin(a)**2 + cos(a)**2)/(sin(a)*cos(a)) → 2/sin(2*a)", "error": null, "prep": "6-0", "ord": 118}, {"id": "6-7", "topic": 6, "title": "rewrite", "code": "print(sin(a).rewrite(cos))\nprint(cos(a).rewrite(sin))\nprint(sin(a).rewrite(exp))", "output": "cos(a - pi/2)\nsin(a + pi/2)\n-I*(exp(I*a) - exp(-I*a))/2", "error": null, "prep": "6-0", "ord": 119}, {"id": "6-8", "topic": 6, "title": "곱 → 합차 (TR8)", "code": "print(TR8(sin(a)*cos(b)))\nprint(TR8(cos(a)*cos(b)))\nprint(TR8(sin(a)*sin(b)))", "output": "sin(a - b)/2 + sin(a + b)/2\ncos(a - b)/2 + cos(a + b)/2\ncos(a - b)/2 - cos(a + b)/2", "error": null, "prep": "6-0", "ord": 120}, {"id": "6-9", "topic": 6, "title": "반각 (TR7)", "code": "print(TR7(cos(a)**2))\nprint(TR7(cos(a/2)**2))", "output": "cos(2*a)/2 + 1/2\ncos(a)/2 + 1/2", "error": null, "prep": "6-0", "ord": 121}, {"id": "6-10", "topic": 6, "title": "합차 → 곱 : trigsimp vs TR9", "code": "print(trigsimp(sin(a) + sin(b)))\nprint(TR9(sin(a) + sin(b)))", "output": "sin(a) + sin(b)\n2*sin(a/2 + b/2)*cos(a/2 - b/2)", "error": null, "prep": "6-0", "ord": 122}, {"id": "6-11", "topic": 6, "title": "Eq 는 틀린 공식도 출력", "code": "right = Eq(sin(a/2)**2, (1 - cos(a))/2)\nwrong = Eq(sin(a/2)**2, (1 + cos(a))/2)\nprint(right); print(wrong)", "output": "Eq(sin(a/2)**2, 1/2 - cos(a)/2)\nEq(sin(a/2)**2, cos(a)/2 + 1/2)", "error": null, "prep": "6-0", "ord": 123}, {"id": "6-12", "topic": 6, "title": "검증 : simplify, equals", "code": "print(simplify(right.lhs - right.rhs), simplify(wrong.lhs - wrong.rhs))\nprint(right.lhs.equals(right.rhs), wrong.lhs.equals(wrong.rhs))", "output": "0 -cos(a)\nTrue False", "error": null, "prep": "6-0", "ord": 124}, {"id": "6-13", "topic": 6, "title": "75° : 정확값 vs 소수", "code": "import numpy as np\nprint(sin(75*pi/180), np.sin(np.deg2rad(75)))\nprint(tan(75*pi/180), np.tan(np.deg2rad(75)))", "output": "sqrt(2)/4 + sqrt(6)/4 0.9659258262890683\nsqrt(3) + 2 3.7320508075688776", "error": null, "prep": "6-0", "ord": 125}, {"id": "6-14", "topic": 6, "title": "공식 검증 : 숫자 대입", "code": "g = lambdify((a, b), sin(a)*cos(b) - (sin(a+b) + sin(a-b))/2)\nA, B = np.random.uniform(-10, 10, (2, 1000))\nprint(np.abs(g(A, B)).max())", "output": "9.43689570931383e-16", "error": null, "prep": "6-0", "ord": 126}, {"id": "6-15", "topic": 6, "title": "공식 검증 : 기호 증명", "code": "simplify(sin(a)*cos(b) - (sin(a+b) + sin(a-b))/2)", "output": "0", "error": null, "prep": "6-0", "ord": 127}, {"id": "7-0", "topic": 7, "title": "[7] 준비", "code": "from sympy import *\nfrom itertools import count, islice\nk, n = symbols('k n', integer=True, positiv +1) - a(n) - 3, a(n), {a(1): 2})", "output": "3*n - 1", "error": null, "prep": "7-0b", "ord": 147}, {"id": "7-19", "topic": 7, "title": "rsolve 실패 (교재 예제 6.9) : a(n+1) = 2ⁿ a(n)", "code": "try: rsolve(a(n+1) - 2**n * a(n), a(n), {a(1): 1})\nexcept ValueError as e: print('오류:', e)", "output": "오류: Polynomial or rational function expected, got '-2**n'", "error": null, "prep": "7-0b", "ord": 148}, {"id": "7-20", "topic": 7, "title": "로그를 취하면 rsolve 가 풂 : c(n) = log₂ a(n)", "code": "c = Function('c')\ncn = rsolve(c(n+1) - c(n) - n, c(n), {c(1): 0})\nprint('a(n) =', 2**cn)", "output": "a(n) = 2**(n*(n - 1)/2)", "error": null, "prep": "7-0b", "ord": 149}, {"id": "7-0c", "topic": 7, "title": "[7] 준비", "code": "from sympy import *\nk, n = symbols('k n', integer=True, positive=True)", "output": "", "error": null, "prep": null, "ord": 150}, {"id": "7-21", "topic": 7, "title": "등비급수 ① 부분합 관찰 (r = 1/2)", "code": "p = 0.0\nfor i in range(51): p += 0.5**i\np", "output": "1.9999999999999991", "error": null, "prep": "7-0c", "ord": 151}, {"id": "7-22", "topic": 7, "title": "등비급수 ② 부분합 → limit", "code": "Sn = Sum(Rational(1, 2)**k, (k, 0, n)).doit()\nprint(Sn); print(limit(Sn, n, oo))", "output": "2 - 2*2**(-n - 1)\n2", "error": null, "prep": "7-0c", "ord": 152}, {"id": "7-23", "topic": 7, "title": "등비급수 ③ 무한급수 직접 / 수렴 판정", "code": "print(Sum(Rational(1, 2)**k, (k, 1, oo)).doit())\nprint(Sum(Rational(3, 2)**k, (k, 1, oo)).is_convergent())", "output": "1\nFalse", "error": null, "prep": "7-0c", "ord": 153}, {"id": "7-24", "topic": 7, "title": "등비급수 ④ 공비를 문자로 → 수렴 조건까지", "code": "rr = symbols('r')\nSum(rr**k, (k, 0, oo)).doit()", "output": "Piecewise((1/(1 - r), Abs(r) < 1), (Sum(r**k, (k, 0, oo)), True))", "error": null, "prep": "7-0c", "ord": 154}, {"id": "8-0", "topic": 8, "title": "[8] 준비", "code": "from sympy import *\nx, h = symbols('x h')", "output": "", "error": null, "prep": null, "ord": 155}, {"id": "8-1", "topic": 8, "title": "Limit + doit", "code": "L = Limit(sin(2*x)/(3*x), x, 0)\nprint(L)\nprint(L.doit())", "output": "Limit(sin(2*x)/(3*x), x, 0, dir='+')\n2/3", "error": null, "prep": "8-0", "ord": 156}, {"id": "8-2", "topic": 8, "title": "limit", "code": "limit(sin(2*x)/(3*x), x, 0)", "output": "2/3", "error": null, "prep": "8-0", "ord": 157}, {"id": "8-3", "topic": 8, "title": "극한 방향: 기본값은 '+'", "code": "print(limit(1/x, x, 0))\nprint(limit(1/x, x, 0, dir='-'))\nprint(limit(1/x, x, 0, dir='+-'))", "output": "oo\n-oo\nzoo", "error": null, "prep": "8-0", "ord": 158}, {"id": "8-0b", "topic": 8, "title": "[8] 준비", "code": "from sympy import *\nfrom sympy.calculus.util import continuous_domain\nimport numpy as np\nx = symbols('x')", "output": "", "error": null, "prep": null, "ord": 159}, {"id": "8-4", "topic": 8, "title": "연속 판정 함수 (좌극한 = 우극한 = 함숫값)", "code": "def check(f, a):\n    L, R, v = limit(f, x, a, '-'), limit(f, x, a, '+'), f.subs(x, a)\n    print('좌', L, '| 우', R, '| 함숫값', v, '→', L == R == v)", "output": "", "error": null, "prep": "8-0b", "ord": 160}, {"id": "8-5", "topic": 8, "title": "연속인 경우", "code": "check(x**2 + 1, 1)", "output": "좌 2 | 우 2 | 함숫값 2 → True", "error": null, "prep": "8-0b", "ord": 161}, {"id": "8-6", "topic": 8, "title": "극한은 있지만 함숫값이 없는 경우", "code": "check((x**2 - 1)/(x - 1), 1)\ncheck(sin(x)/x, 0)", "output": "좌 2 | 우 2 | 함숫값 nan → False\n좌 1 | 우 1 | 함숫값 nan → False", "error": null, "prep": "8-0b", "ord": 162}, {"id": "8-7", "topic": 8, "title": "좌·우극한이 다른 경우 (가우스 기호)", "code": "check(floor(x), 1)", "output": "좌 0 | 우 1 | 함숫값 1 → False", "error": null, "prep": "8-0b", "ord": 163}, {"id": "8-8", "topic": 8, "title": "연속 구간 자동 계산 : continuous_domain", "code": "print(continuous_domain(1/(x - 1), x, S.Reals))\nprint(continuous_domain(sqrt(x), x, S.Reals))\nprint(continuous_domain(sin(x)/x, x, S.Reals))", "output": "Union(Interval.open(-oo, 1), Interval.open(1, oo))\nInterval(0, oo)\nUnion(Interval.open(-oo, 0), Interval.open(0, oo))", "error": null, "prep": "8-0b", "ord": 164}, {"id": "8-9", "topic": 8, "title": "불연속점 찾기 : singularities", "code": "print(singularities(1/(x**2 - 1), x))\nprint(singularities(tan(x), x, Interval(0, 2*pi)))", "output": "{-1, 1}\n{pi/2, 3*pi/2}", "error": null, "prep": "8-0b", "ord": 165}, {"id": "8-10", "topic": 8, "title": "continuous_domain 의 한계 : floor 는 못 함", "code": "try: continuous_domain(floor(x), x, Interval(0, 3))\nexcept NotImplementedError: print('floor → 판단 불가')", "output": "floor → 판단 불가", "error": null, "prep": "8-0b", "ord": 166}, {"id": "8-11", "topic": 8, "title": "구간별 함수 (Piecewise)", "code": "f = Piecewise((x**2, x < 1), (x + 2, True))\nprint(f)\nprint(f.subs(x, 0.5), f.subs(x, 1), f.subs(x, 2))", "output": "Piecewise((x**2, x < 1), (x + 2, True))\n0.250000000000000 3 4", "error": null, "prep": "8-0b", "ord": 167}, {"id": "8-12", "topic": 8, "title": "Piecewise 의 좌극한 : 1 이어야 하는데 3 이 나온다 (오류!)", "code": "print('좌극한  :', limit(f, x, 1, '-'))\nprint('우극한  :', limit(f, x, 1, '+'))\nprint('양쪽    :', limit(f, x, 1, '+-'))", "output": "좌극한  : 3\n우극한  : 3\n양쪽    : 3", "error": null, "prep": "8-0b", "ord": 168}, {"id": "8-13", "topic": 8, "title": "h 를 이용해 직접 확인하면 바르게 나온다", "code": "h = symbols('h', positive=True)\nprint('좌극한 :', limit(f.subs(x, 1 - h), h, 0))\nprint('우극한 :', limit(f.subs(x, 1 + h), h, 0))", "output": "좌극한 : 1\n우극한 : 3", "error": null, "prep": "8-0b", "ord": 169}, {"id": "8-14", "topic": 8, "title": "그래프로도 확인", "code": "plot(f, (x, -1, 3), size=(4, 3))", "output": "", "error": null, "prep": "8-0b", "ord": 170}, {"id": "8-15", "topic": 8, "title": "continuous_domain 도 Piecewise 는 못 함", "code": "try: continuous_domain(f, x, S.Reals)\nexcept NotImplementedError: print('Piecewise → 판단 불가')", "output": "Piecewise → 판단 불가", "error": null, "prep": "8-0b", "ord": 171}, {"id": "8-16", "topic": 8, "title": "사잇값 정리 ① 부호 확인 : x³ + x - 1 = 0 은 (0, 1) 에 근이 있다", "code": "g = x**3 + x - 1\nprint(g.subs(x, 0), g.subs(x, 1))", "output": "-1 1", "error": null, "prep": "8-0b", "ord": 172}, {"id": "8-17", "topic": 8, "title": "사잇값 정리 ② nsolve", "code": "nsolve(g, x, 0.5)", "output": "0.682327803828019", "error": null, "prep": "8-0b", "ord": 173}, {"id": "8-18", "topic": 8, "title": "사잇값 정리 ③ 이분법 직접 구현", "code": "gf = lambdify(x, g); a, b = 0, 1\nfor _ in range(30):\n    m = (a + b) / 2; a, b = (m, b) if gf(a)*gf(m) > 0 else (a, m)\nprint(m)", "output": "0.6823278041556478", "error": null, "prep": "8-0b", "ord": 174}, {"id": "8-19", "topic": 8, "title": "사잇값 정리 ④ 정확한 근 : solve 는 복소근까지 3개", "code": "print([N(r, 6) for r in solve(g, x)])", "output": "[-0.341164 - 1.16154*I, -0.341164 + 1.16154*I, 0.682328]", "error": null, "prep": "8-0b", "ord": 175}, {"id": "8-20", "topic": 8, "title": "사잇값 정리 ⑤ 실근만 : solveset(실수) / real_roots", "code": "print(solveset(g, x, S.Reals))\nprint(real_roots(g))", "output": "{-1/(3*(1/2 + sqrt(93)/18)**(1/3)) + (1/2 + sqrt(93)/18)**(1/3)}\n[CRootOf(x**3 + x - 1, 0)]", "error": null, "prep": "8-0b", "ord": 176}, {"id": "8-21", "topic": 8, "title": "최대·최소 정리 : 닫힌 구간에서 maximum, minimum", "code": "q = x**3 - 3*x\nprint(maximum(q, x, Interval(-2, 3)), minimum(q, x, Interval(-2, 3)))", "output": "18 -2", "error": null, "prep": "8-0b", "ord": 177}, {"id": "8-22", "topic": 8, "title": "열린 구간 (0,1) 의 1/x : 최솟값이 없는데 1 을 돌려줌 (하한을 줌)", "code": "print(maximum(1/x, x, Interval.open(0, 1)))\nprint(minimum(1/x, x, Interval.open(0, 1)))", "output": "oo\n1", "error": null, "prep": "8-0b", "ord": 178}, {"id": "9-0", "topic": 9, "title": "[9] 준비", "code": "from sympy import *\nx, h = symbols('x h')", "output": "", "error": null, "prep": null, "ord": 179}, {"id": "9-1", "topic": 9, "title": "미분 ① 정의", "code": "f = x**2 + x\nlimit((f.subs(x, x+h) - f)/h, h, 0, dir='+-')", "output": "2*x + 1", "error": null, "prep": "9-0", "ord": 180}, {"id": "9-2", "topic": 9, "title": "미분 ② Derivative + doit", "code": "Derivative(f, x).doit()", "output": "2*x + 1", "error": null, "prep": "9-0", "ord": 181}, {"id": "9-3", "topic": 9, "title": "미분 ③ diff", "code": "diff(f, x)", "output": "2*x + 1", "error": null, "prep": "9-0", "ord": 182}, {"id": "9-4", "topic": 9, "title": "|x|, x=0 : 정의 (좌·우)", "code": "print(limit(Abs(h)/h, h, 0, dir='-'))\nprint(limit(Abs(h)/h, h, 0, dir='+'))", "output": "-1\n1", "error": null, "prep": "9-0", "ord": 183}, {"id": "9-5", "topic": 9, "title": "|x|, x=0 : 정의 (양쪽) → 오류", "code": "try: limit(Abs(h)/h, h, 0, dir='+-')\nexcept ValueError as e: print('오류:', e)", "output": "오류: The limit does not exist since left hand limit = -1 and right hand limit = 1", "error": null, "prep": "9-0", "ord": 184}, {"id": "9-6", "topic": 9, "title": "|x|, x=0 : diff → 0 (틀린 답)", "code": "xr = symbols('xr', real=True)\nd = diff(Abs(xr), xr)\nprint(d, d.subs(xr, 0))", "output": "sign(xr) 0", "error": null, "prep": "9-0", "ord": 185}, {"id": "9-7", "topic": 9, "title": "추상함수 f(x)", "code": "F = Function('f')\nprint(diff(F(x), x))\nprint(Derivative(F(x), x).as_finite_difference(h))", "output": "Derivative(f(x), x)\n-f(-h/2 + x)/h + f(h/2 + x)/h", "error": null, "prep": "9-0", "ord": 186}, {"id": "9-0b", "topic": 9, "title": "[9] 준비", "code": "from sympy import *\nimport numpy as np\nimport matplotlib.pyplot as plt\nx, h, y = symbols('x h y', real=True)", "output": "", "error": null, "prep": null, "ord": 187}, {"id": "9-8", "topic": 9, "title": "입력 (엔터만 치면 x**2-3*x+1, x=1)", "code": "f = sympify(input('f(x) = ') or 'x**2-3*x+1', locals={'x': x})\na = sympify(input('x = ') or '1')\nfa = f.subs(x, a)", "output": "", "error": null, "prep": "9-0b", "ord": 188}, {"id": "9-9", "topic": 9, "title": "할선 기울기 함수", "code": "def slope(hh):\n    return (f.subs(x, a+hh) - fa) / hh", "output": "", "error": null, "prep": "9-0b", "ord": 189}, {"id": "9-10", "topic": 9, "title": "h 줄이기 (오른쪽, 왼쪽)", "code": "H = [Rational(1, 2**k) for k in range(8)]\nfor hh in H:\n    print(hh, round(float(slope(hh)), 5), round(float(slope(-hh)), 5))", "output": "1 0.0 -2.0\n1/2 -0.5 -1.5\n1/4 -0.75 -1.25\n1/8 -0.875 -1.125\n1/16 -0.9375 -1.0625\n1/32 -0.96875 -1.03125\n1/64 -0.98438 -1.01562\n1/128 -0.99219 -1.00781", "error": null, "prep": "9-0b", "ord": 190}, {"id": "9-11", "topic": 9, "title": "정의 : h → 0", "code": "try:\n    m = limit(slope(h), h, 0, dir='+-')\nexcept ValueError:\n    m = nan; print('미분 불가능')\nprint('기울기 :', m)", "output": "기울기 : -1", "error": null, "prep": "9-0b", "ord": 191}, {"id": "9-12", "topic": 9, "title": "diff 와 비교", "code": "print('diff   :', diff(f, x).subs(x, a))", "output": "diff   : -1", "error": null, "prep": "9-0b", "ord": 192}, {"id": "9-13", "topic": 9, "title": "접선의 방정식", "code": "T = Eq(y - fa, m*(x - a))\nprint(simplify(T))\nprint(solve(T, y))", "output": "Eq(x, -y)\n[-x]", "error": null, "prep": "9-0b", "ord": 193}, {"id": "9-14", "topic": 9, "title": "그래프 준비", "code": "f_np = lambdify(x, f, 'numpy')\naf, faf = float(a), float(fa)\nxs = np.linspace(af-3, af+3, 400)", "output": "", "error": null, "prep": "9-0b", "ord": 194}, {"id": "9-15", "topic": 9, "title": "오른쪽 할선 (h > 0)", "code": "plt.plot(xs, f_np(xs), 'k')\nfor hh in H: plt.plot(xs, float(slope(hh))*(xs-af) + faf, 'b', alpha=.3)\nplt.plot(xs, float(m)*(xs-af) + faf, 'r--')\nplt.ylim(f_np(xs).min()-1, f_np(xs).max()+1); plt.show()", "output": "", "error": null, "prep": "9-0b", "ord": 195}, {"id": "9-16", "topic": 9, "title": "왼쪽 할선 (h < 0)", "code": "plt.plot(xs, f_np(xs), 'k')\nfor hh in H: plt.plot(xs, float(slope(-hh))*(xs-af) + faf, 'g', alpha=.3)\nplt.plot(xs, float(m)*(xs-af) + faf, 'r--')\nplt.ylim(f_np(xs).min()-1, f_np(xs).max()+1); plt.show()", "output": "", "error": null, "prep": "9-0b", "ord": 196}, {"id": "9-17", "topic": 9, "title": "애니메이션 ① 바탕 (코랩/주피터)", "code": "from matplotlib.animation import FuncAnimation\nfrom IPython.display import HTML\nfig, ax = plt.subplots(); plt.close(fig)\nax.plot(xs, f_np(xs), 'k'); ax.set_ylim(f_np(xs).min()-1, f_np(xs).max()+1);", "output": "", "error": "ModuleNotFoundError", "prep": "9-0b", "ord": 197}, {"id": "9-18", "topic": 9, "title": "애니메이션 ② 접선, 할선", "code": "ax.plot(xs, float(m)*(xs-af) + faf, 'r--')\nline, = ax.plot([], [], 'b')\ntxt = ax.text(0.05, 0.9, '', transform=ax.transAxes)\nhf = np.geomspace(1, 1e-3, 40)", "output": "", "error": "NameError", "prep": "9-0b", "ord": 198}, {"id": "9-19", "topic": 9, "title": "애니메이션 ③ h 바꾸기", "code": "def update(i):\n    s = (f_np(af + hf[i]) - faf) / hf[i]\n    line.set_data(xs, s*(xs-af) + faf)\n    txt.set_text(f'h={hf[i]:.4f}  slope={s:.4f}')", "output": "", "error": null, "prep": "9-0b", "ord": 199}, {"id": "9-20", "topic": 9, "title": "애니메이션 ④ 재생", "code": "anim = FuncAnimation(fig, update, frames=40, interval=120)\nHTML(anim.to_jshtml())", "output": "", "error": "NameError", "prep": "9-0b", "ord": 200}, {"id": "9-21", "topic": 9, "title": "h 더 줄이기 : 정확한 수 vs 소수", "code": "for k in [1, 4, 8, 12, 15]:\n    e1 = abs(N(slope(Rational(1, 10**k)) - m, 30))\n    e2 = abs((f_np(af + 10.0**-k) - faf)/10.0**-k - float(m))\n    print(f'1e-{k}  {float(e1):.1e}  {e2:.1e}')", "output": "1e-1  1.0e-01  1.0e-01\n1e-4  1.0e-04  1.0e-04\n1e-8  1.0e-08  6.1e-09\n1e-12  1.0e-12  8.9e-05\n1e-15  1.0e-15  3.3e-01", "error": null, "prep": "9-0b", "ord": 201}, {"id": "9-0c", "topic": 9, "title": "[9] 준비", "code": "from sympy import *\nimport numpy as np\nfrom scipy.optimize import minimize_scalar\nx = symbols('x'); f = x**3 - 3*x", "output": "", "error": null, "prep": null, "ord": 202}, {"id": "9-22", "topic": 9, "title": "방법 ① f'(x) = 0 을 solve", "code": "cp = solve(diff(f, x), x)\ncp", "output": "[-1, 1]", "error": null, "prep": "9-0c", "ord": 203}, {"id": "9-23", "topic": 9, "title": "방법 ② stationary_points", "code": "stationary_points(f, x)", "output": "{-1, 1}", "error": null, "prep": "9-0c", "ord": 204}, {"id": "9-24", "topic": 9, "title": "이계도함수로 극대·극소 판정", "code": "for c in cp:\n    print(c, f.subs(x, c), '극대' if diff(f, x, 2).subs(x, c) < 0 else '극소')", "output": "-1 2 극대\n1 -2 극소", "error": null, "prep": "9-0c", "ord": 205}, {"id": "9-25", "topic": 9, "title": "증가·감소 판정 : is_increasing / is_decreasing", "code": "print(is_increasing(f, Interval(1, oo)))\nprint(is_decreasing(f, Interval(-1, 1)))", "output": "True\nTrue", "error": null, "prep": "9-0c", "ord": 206}, {"id": "9-26", "topic": 9, "title": "증가·감소 구간 : solveset 으로 부등식 풀기", "code": "print(solveset(diff(f, x) > 0, x, S.Reals))\nprint(solveset(diff(f, x) < 0, x, S.Reals))", "output": "Union(Interval.open(-oo, -1), Interval.open(1, oo))\nInterval.open(-1, 1)", "error": null, "prep": "9-0c", "ord": 207}, {"id": "9-27", "topic": 9, "title": "함정 : f'(x) = 0 이라고 극값은 아니다 (x³)", "code": "g = x**3\nprint(stationary_points(g, x))\nprint(diff(g, x, 2).subs(x, 0))     # 0 → 이계도함수로 판정 불가", "output": "{0}\n0", "error": null, "prep": "9-0c", "ord": 208}, {"id": "9-28", "topic": 9, "title": "(이어서) 부호 변화로 확인", "code": "gp = diff(g, x)\nprint(gp.subs(x, -0.1), gp.subs(x, 0.1))   # 둘 다 양수 → 극값 아님", "output": "0.0300000000000000 0.0300000000000000", "error": null, "prep": "9-0c", "ord": 209}, {"id": "9-29", "topic": 9, "title": "수치 방법 : scipy minimize_scalar", "code": "fn = lambdify(x, f)\nr = minimize_scalar(fn, bounds=(0, 3), method='bounded')\nprint(r.x, r.fun)", "output": "1.0000007330905558 -1.9999999999983877", "error": null, "prep": "9-0c", "ord": 210}, {"id": "9-30", "topic": 9, "title": "구간 [-3, 3] : 수치 방법은 극소(x=1)에 머문다", "code": "r = minimize_scalar(fn, bounds=(-3, 3), method='bounded')\nprint('minimize_scalar :', r.x, r.fun)\nprint('minimum         :', minimum(f, x, Interval(-3, 3)))   # 실제 최솟값 (x=-3)", "output": "minimize_scalar : 1.0000012327722716 -1.9999999999954405\nminimum         : -18", "error": null, "prep": "9-0c", "ord": 211}, {"id": "9-31", "topic": 9, "title": "수치 방법 ② linspace 로 가장 작은 값 찾기 (교재 방식)", "code": "xs = np.linspace(-3, 3, 1201)\nys = fn(xs)\nprint(xs[ys.argmin()], ys.min())", "output": "-3.0 -18.0", "error": null, "prep": "9-0c", "ord": 212}, {"id": "9-32", "topic": 9, "title": "그래프 : f 와 f' 를 함께", "code": "plot(f, diff(f, x), (x, -2.5, 2.5), ylim=(-5, 5), legend=True, size=(5, 4))", "output": "", "error": null, "prep": "9-0c", "ord": 213}, {"id": "10-0", "topic": 10, "title": "[10] 준비", "code": "from sympy import *\nx = symbols('x')", "output": "", "error": null, "prep": null, "ord": 214}, {"id": "10-1", "topic": 10, "title": "적분 ① Integral + doit", "code": "I = Integral(x**2, (x, 0, 1))\nprint(I)\nprint(I.doit())", "output": "Integral(x**2, (x, 0, 1))\n1/3", "error": null, "prep": "10-0", "ord": 215}, {"id": "10-2", "topic": 10, "title": "적분 ② integrate", "code": "integrate(x**2, (x, 0, 1))", "output": "1/3", "error": null, "prep": "10-0", "ord": 216}, {"id": "10-3", "topic": 10, "title": "못 푸는 적분 → evalf", "code": "J = Integral(exp(-x**2)*sin(x**3), (x, 0, 1))\nprint(J.doit())\nprint(J.evalf())", "output": "Integral(exp(-x**2)*sin(x**3), (x, 0, 1))\n0.125012519603065", "error": null, "prep": "10-0", "ord": 217}, {"id": "10-0b", "topic": 10, "title": "[10] 준비", "code": "from sympy import *\nimport numpy as np\nimport matplotlib.pyplot as plt", "output": "", "error": null, "prep": null, "ord": 218}, {"id": "10-0c", "topic": 10, "title": "[10] 준비", "code": "from scipy.integrate import simpson, quad\nx = symbols('x')\nn, k = symbols('n k', integer=True, positive=True)", "output": "", "error": null, "prep": null, "ord": 219}, {"id": "10-4", "topic": 10, "title": "정확값 : integrate", "code": "integrate(x**2, (x, 0, 1))", "output": "1/3", "error": null, "prep": "10-0c", "ord": 220}, {"id": "10-5", "topic": 10, "title": "구분구적법 ① Sum + limit (교재 방식)", "code": "S_n = Sum((k/n)**2 * (1/n), (k, 1, n)).doit()\nprint(S_n)\nprint(limit(S_n, n, oo))", "output": "(n**3/3 + n**2/2 + n/6)/n**3\n1/3", "error": null, "prep": "10-0c", "ord": 221}, {"id": "10-6", "topic": 10, "title": "구분구적법 ② as_sum : n 을 문자로 둔 채 합을 만듦", "code": "R = Integral(x**2, (x, 0, 1)).as_sum(n, method='right')\nprint(R)\nprint(limit(R, n, oo))", "output": "(n**3/3 + n**2/2 + n/6)/n**3\n1/3", "error": null, "prep": "10-0c", "ord": 222}, {"id": "10-7", "topic": 10, "title": "as_sum 으로 네 가지 방법 비교 (n = 4)", "code": "I = Integral(x**2, (x, 0, 1))\nfor m in ['left', 'right', 'midpoint', 'trapezoid']:\n    print(m, I.as_sum(4, method=m))", "output": "left 7/32\nright 15/32\nmidpoint 21/64\ntrapezoid 11/32", "error": null, "prep": "10-0c", "ord": 223}, {"id": "10-8", "topic": 10, "title": "as_sum 에 'simpson' 은 없다", "code": "try: I.as_sum(4, method='simpson')\nexcept ValueError as e: print('오류:', e)", "output": "오류: Unknown method simpson", "error": null, "prep": "10-0c", "ord": 224}, {"id": "10-9", "topic": 10, "title": "사다리꼴 ① 직접 구현", "code": "def trap(f, a, b, n):\n    xs = np.linspace(a, b, n + 1)\n    ys = f(xs)\n    return (b - a) / n * (ys[0]/2 + ys[1:-1].sum() + ys[-1]/2)", "output": "", "error": null, "prep": "10-0c", "ord": 225}, {"id": "10-10", "topic": 10, "title": "사다리꼴 ② numpy.trapezoid", "code": "xs = np.linspace(0, np.pi, 5)\nprint(trap(np.sin, 0, np.pi, 4))\nprint(np.trapezoid(np.sin(xs), xs))", "output": "1.8961188979370398\n1.8961188979370398", "error": null, "prep": "10-0c", "ord": 226}, {"id": "10-11", "topic": 10, "title": "심프슨 ① 직접 구현 (n 은 짝수)", "code": "def simp(f, a, b, n):\n    xs = np.linspace(a, b, n + 1); ys = f(xs)\n    return (b - a) / (3*n) * (ys[0] + 4*ys[1:-1:2].sum() + 2*ys[2:-1:2].sum() + ys[-1])", "output": "", "error": null, "prep": "10-0c", "ord": 227}, {"id": "10-12", "topic": 10, "title": "심프슨 ② scipy.integrate.simpson", "code": "print(simp(np.sin, 0, np.pi, 4))\nprint(simpson(np.sin(xs), x=xs))", "output": "2.0045597549844207\n2.0045597549844207", "error": null, "prep": "10-0c", "ord": 228}, {"id": "10-13", "topic": 10, "title": "수치적분 ③ scipy quad / Integral.evalf", "code": "print(quad(np.sin, 0, np.pi))\nprint(Integral(sin(x), (x, 0, pi)).evalf())", "output": "(2.0, 2.220446049250313e-14)\n2.00000000000000", "error": null, "prep": "10-0c", "ord": 229}, {"id": "10-14", "topic": 10, "title": "n 에 따른 오차 비교 : ∫₀^π sin x dx = 2", "code": "for m in [2, 4, 8, 16, 32]:\n    print(m, abs(trap(np.sin, 0, np.pi, m) - 2), abs(simp(np.sin, 0, np.pi, m) - 2))", "output": "2 0.42920367320510344 0.09439510239319526\n4 0.1038811020629602 0.0045597549844207386\n8 0.025768398054449193 0.00026916994838765973\n16 0.006429656227660452 1.6591047935499148e-05\n32 0.0016066390298552502 1.0333694127062643e-06", "error": null, "prep": "10-0c", "ord": 230}, {"id": "10-15", "topic": 10, "title": "오차 그래프 (로그 눈금)", "code": "ms = [2, 4, 8, 16, 32, 64]\nplt.loglog(ms, [abs(trap(np.sin, 0, np.pi, m) - 2) for m in ms], 'o-', label='trapezoid')\nplt.loglog(ms, [abs(simp(np.sin, 0, np.pi, m) - 2) for m in ms], 's-', label='simpson')\nplt.xlabel('n'); plt.ylabel('error'); plt.legend(); plt.show()", "output": "", "error": null, "prep": "10-0c", "ord": 231}, {"id": "10-16", "topic": 10, "title": "심프슨은 3차함수까지 n=2 로도 정확하다", "code": "f3 = lambda t: t**3 - 2*t + 1\nprint('정확   :', integrate(x**3 - 2*x + 1, (x, 0, 2)))\nprint(trap(f3, 0, 2, 2), simp(f3, 0, 2, 2))", "output": "정확   : 2\n3.0 2.0", "error": null, "prep": "10-0c", "ord": 232}, {"id": "10-17", "topic": 10, "title": "시각화 ① 직사각형 (오른쪽 끝점)", "code": "X = np.linspace(0, np.pi, 300); xb = np.linspace(0, np.pi, 7)\nplt.plot(X, np.sin(X), 'k')\nplt.bar(xb[1:], np.sin(xb[1:]), width=-np.pi/6, align='edge', alpha=.3, edgecolor='b')\nplt.title('right Riemann sum'); plt.show()", "output": "", "error": null, "prep": "10-0c", "ord": 233}, {"id": "10-18", "topic": 10, "title": "시각화 ② 사다리꼴", "code": "plt.plot(X, np.sin(X), 'k')\nplt.fill_between(xb, np.sin(xb), alpha=.3, edgecolor='r')\nplt.plot(xb, np.sin(xb), 'ro-'); plt.title('trapezoid'); plt.show()", "output": "", "error": null, "prep": "10-0c", "ord": 234}, {"id": "10-19", "topic": 10, "title": "정적분 ≠ 넓이 : sin x 를 0 ~ 2π", "code": "print('정적분 :', integrate(sin(x), (x, 0, 2*pi)))\nprint('넓이   :', integrate(Abs(sin(x)), (x, 0, 2*pi)))", "output": "정적분 : 0\n넓이   : 4", "error": null, "prep": "10-0c", "ord": 235}, {"id": "10-20", "topic": 10, "title": "두 곡선 사이 넓이 : y = x², y = x + 2", "code": "p = solve(x**2 - (x + 2), x)\nprint('교점 :', p)\nprint('넓이 :', integrate((x + 2) - x**2, (x, p[0], p[1])))", "output": "교점 : [-1, 2]\n넓이 : 9/2", "error": null, "prep": "10-0c", "ord": 236}, {"id": "10-21", "topic": 10, "title": "기호적분 결과가 교육과정 밖 함수일 때 : e^(-x²)", "code": "r = integrate(exp(-x**2), (x, 0, 1))\nprint(r)                     # erf : 고교 과정에 없는 함수\nprint(N(r))", "output": "sqrt(pi)*erf(1)/2\n0.746824132812427", "error": null, "prep": "10-0c", "ord": 237}, {"id": "10-22", "topic": 10, "title": "(이어서) 같은 값을 수치로", "code": "g = lambda t: np.exp(-t**2)\nprint(trap(g, 0, 1, 10), simp(g, 0, 1, 10), quad(g, 0, 1)[0])", "output": "0.7462107961317495 0.7468249482544436 0.7468241328124271", "error": null, "prep": "10-0c", "ord": 238}, {"id": "10-114", "topic": 10, "title": "부정적분 : Integral·integrate 모두 적분상수를 생략한다", "code": "c = symbols('c')\nprint(Integral(3*x**2, x).doit(), integrate(3*x**2, x))", "output": "x**3 x**3", "error": null, "prep": null, "ord": 239}, {"id": "10-115", "topic": 10, "title": "적분상수를 직접 붙여 조건으로 구하기 (교재 예제 8.3)", "code": "F = integrate(4*x**3 - 2*x + 1, x) + c\nprint(F)\nprint(solve(Eq(F.subs(x, 0), 2), c), '→', F.subs(c, 2))", "output": "c + x**4 - x**2 + x\n[2] → x**4 - x**2 + x + 2", "error": null, "prep": null, "ord": 240}];
