<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CELL = Object.fromEntries(CELLS.map(c => [c.id, c]));
["9-17", "9-18", "9-19", "9-20"].forEach(id => { if (CELL[id]) { CELL[id].error = null; CELL[id].output = id === "9-20" ? "(코랩에서 실행하면 애니메이션이 재생됩니다)" : ""; } });
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

/* ---------- 군더더기 글귀 정리 ---------- */
const clean = s => String(s || "").replace(/\s*\((?:교재|교과서)[^)]*\)/g, "").replace(/\s*\(\s*\d+-\d+[^)]*\)/g, "").replace(/(?:^|\s)\d+-\d+(?:에서|의|과|와)\s+/g, " ").replace(/^[^:：]*[:：]\s*(?=\S)/, m => /①|②|③|④|⑤/.test(m) ? m : "").trim();
const ctitle = c => clean(c.title).replace(/\s+/g, " ");

/* ---------- 데이터 정리 ---------- */
const COURSES = ["공통수학1", "공통수학2", "대수", "미적분Ⅰ", "미적분Ⅱ"];
const LIBS = { sympy: "SymPy", numpy: "NumPy", scipy: "SciPy", python: "Pure Python", matplotlib: "Matplotlib" };
TOPICS.forEach(t => { t.courses = COURSES.filter(c => t.units.some(u => u.startsWith(c))); t.compare.forEach(r => { r[0] = clean(r[0]); }); });
const FN = Object.fromEntries(FUNCS.map(f => [f.k, f]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
FUNCS.forEach(f => {
  f.re = new RegExp(f.pat || `(?<![\\w.])${reEsc(f.k)}\\(`);
  f.sub = ONE[f.k] || SHORT[f.k][0]; f.cmp = SHORT[f.k][1];
  f.cells = CELLS.filter(c => !/-0[a-f]?$/.test(c.id) && c.id !== "1-100" && f.re.test(c.code)).map(c => c.id);
  f.topics = [...new Set(f.cells.map(id => CELL[id].topic))].sort((a, b) => a - b);
  f.courses = COURSES.filter(c => f.topics.some(n => TOPICS[n - 1].courses.includes(c)));
  f.guides = GUIDE.map((g, i) => g.tools.includes(f.k) ? i : -1).filter(i => i >= 0);
  f.know = (KNOW[f.k] || []).map(k => P_[k]).filter(Boolean);
  if (!f.know.length && f.warn) f.know = [{ t: "", d: f.warn }];
});
const usedIn = code => FUNCS.filter(f => f.re.test(code));
const fhref = k => "#f/" + encodeURIComponent(k);
const fchip = (k, label) => FN[k] ? `<a class="fchip" href="${fhref(k)}">${esc(label || FN[k].n)}</a>` : "";
const libTag = f => `<span class="tag lib">${LIBS[f.lib]}</span>`;
const where = f => (f.lib === "python" ? ["python"] : [f.lib === "matplotlib" ? "matplotlib" : f.lib === "sympy" ? "sympy" : "", ...f.path].filter(Boolean)).concat(f.lib === "python" ? f.path : []).join(" › ");

/* ---------- 코드 표시 ---------- */
function hl(code) {
  const kw = /^(from|import|for|in|if|else|elif|def|return|try|except|as|lambda|and|or|not|True|False|None|while|with)$/;
  const re = /(#[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_]\w*)(?=\()|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="nu">${m[3]}</span>`;
    else if (m[4]) out += `<span class="fn">${esc(m[4])}</span>`;
    else out += kw.test(m[5]) ? `<span class="k">${m[5]}</span>` : esc(m[5]);
  }

const SUPM = {}, SUBM = {};

  { i: "()/()", c: 1, h: '<span class="mfrac"><span>□</span><span>□</span></span>', t: "분수" }, { i: "√()", c: 2, h: "√□", t: "제곱근" },
  { i: "||", c: 1, h: "|□|", t: "절댓값" }, { i: "π" }, { i: "∞" }, { i: "θ" }, { i: "≤" }, { i: "≥" }, { i: "≠" }, { i: "±" },
  { i: "sin()", c: 4, h: "sin" }, { i: "cos()", c: 4, h: "cos" }, { i: "tan()", c: 4, h: "tan" }, { i: "log()", c: 4, h: "log" }, { i: "Σ" }, { i: "∫" }

/* ---------- 함수 사전(트리) ---------- */
function treeData() {
  const roots = { sympy: {}, numpy: {}, scipy: {}, matplotlib: {}, python: {} };
  FUNCS.forEach(f => {
    let node = roots[f.lib]; const path = f.lib === "sympy" ? f.path : f.lib === "numpy" ? f.path.slice(1) : f.lib === "scipy" ? f.path.slice(1) : f.path;
    path.forEach(p => { node[p] = node[p] || {}; node = node[p]; });
    (node.__f = node.__f || []).push(f);
  });
  return roots;
}
function countF(node) { return (node.__f || []).length + Object.keys(node).filter(k => k !== "__f").reduce((s, k) => s + countF(node[k]), 0); }
function nodeHTML(name, node, open) {
  const kids = Object.keys(node).filter(k => k !== "__f");
  return `<li><details ${open ? "open" : ""}><summary>${esc(name)} <span class="cnt">${countF(node)}</span></summary>
    ${node.__f ? `<div class="leaves">${node.__f.map(f => `<a class="fchip" href="${fhref(f.k)}" title="${esc(f.sub)}">${esc(f.n)}</a>`).join("")}</div>` : ""}
    ${kids.length ? `<ul>${kids.map(k => nodeHTML(k, node[k], open)).join("")}</ul>` : ""}</details></li>`;
}
function tree() {
  const R = treeData(), names = { sympy: "sympy", numpy: "numpy", scipy: "scipy", matplotlib: "matplotlib", python: "파이썬 내장" };
  return `<div class="in page one"><div>

    <div class="sugwrap" style="margin:16px 0 22px;max-width:520px"><div class="searchbar"><input id="tq" type="search" placeholder="함수 이름이나 하는 일 (예: solveset, 극한)" aria-label="함수 검색" autocomplete="off"><span class="ico" aria-hidden="true">⌕</span></div></div>
    <div id="tqres" class="tags" style="margin-bottom:18px"></div>
    <div class="treegrid">
      <ul class="tree"><li class="root">${nodeHTML("sympy", R.sympy, true).slice(4, -5)}</li></ul>
      <ul class="tree">${["numpy", "scipy", "matplotlib", "python"].map(k => `<li class="root">${nodeHTML(names[k], R[k], true).slice(4, -5)}</li>`).join("")}</ul>
    </div></div></div>${foot()}`;
}
function findFuncs(v0) {
  const v = v0.trim().toLowerCase(); if (!v) return [];
  const hit = f => (f.k + " " + f.n + " " + f.sub).toLowerCase().includes(v);
  let r = FUNCS.filter(hit);
  if (!r.length) { const fv = fixWord(v0.trim()).toLowerCase(); r = FUNCS.filter(f => (f.k + " " + f.n + " " + f.sub).toLowerCase().includes(fv)); }
  if (!r.length) r = FUNCS.filter(f => lev(f.k.toLowerCase(), v) <= Math.max(1, Math.floor(v.length / 4)));
  return r;
}
function bindTree() {
  const q = $("#tq");
  const run = () => { const v = q.value.trim(); const r = findFuncs(v); $("#tqres").innerHTML = v ? r.map(f => fchip(f.k)).join("") || `<span class="muted">없는 함수입니다.</span>` : ""; };

      for (let i = 0; i <= n; i++) { const x = xr[0] + (xr[1] - xr[0]) * i / n, y = f(x); if (!isFinite(y) || Math.abs(y) > 1e6) { pen = false; continue; } pen ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)); pen = true; }

  return { cv: $("canvas", el), ro: $(".readout", el), q: s => $(s, el) };
}

    const trap = n => { const h = Math.PI / n; let s = (Math.sin(0) + Math.sin(Math.PI)) / 2; for (let i = 1; i < n; i++) s += Math.sin(i * h); return s * h; };

        ctx.beginPath(); ctx.moveTo(p.X(x0), p.Y(0)); for (let k = 0; k <= 40; k++) { const x = x0 + (x2 - x0) * k / 40; ctx.lineTo(p.X(x), p.Y(q(x))); } ctx.lineTo(p.X(x2), p.Y(0)); ctx.closePath(); ctx.fill(); ctx.stroke(); } }

  },
  bisect(el) {
    const g = x => x ** 3 + x - 1;
    const L = labShell(el, "사잇값 정리와 이분법, 한 단계씩", "x³ + x − 1 = 0, 구간 [0, 1]", `<button type="button" class="primary" id="bs">한 단계 진행</button><button type="button" id="br">처음으로</button>`);
    let st;
    const reset = () => { st = { a: 0, b: 1, log: [] }; draw(); };
    const step = () => { const m = (st.a + st.b) / 2, s = g(st.a) * g(m) > 0; st.log.push([st.a, st.b, m, g(m)]); if (s) st.a = m; else st.b = m; draw(); };
    const draw = () => {
      const p = Plot(L.cv, [-0.1, 1.1], [-1.3, 1.3]).axes(ticks(0, 1, 5), ticks(-1, 1, 4));
      const ctx = p.ctx; ctx.fillStyle = css("--accent-soft"); ctx.fillRect(p.X(st.a), p.pad.t, p.X(st.b) - p.X(st.a), p.H - p.pad.t - p.pad.b);
      p.fn(g, css("--ink"), 2).dot(st.a, g(st.a), css("--c3"), 4).dot(st.b, g(st.b), css("--c1"), 4).dot(0.682327803828019, 0, css("--warn"), 3).done();
      const rows = st.log.slice(-6).map((r, i) => `${String(st.log.length - Math.min(6, st.log.length) + i + 1).padStart(2)}  [${r[0].toFixed(6)}, ${r[1].toFixed(6)}]  중점 ${r[2].toFixed(6)}  g(중점) ${r[3] > 0 ? "+" : "−"}`).join("\n");
      L.ro.innerHTML = `g(0) = −1 < 0, g(1) = 1 > 0 → 사잇값 정리로 (0, 1)에 근이 있다.\n현재 구간 [${st.a.toFixed(8)}, ${st.b.toFixed(8)}], 폭 ${(st.b - st.a).toExponential(2)}\n${rows}\nnsolve(g, x, 0.5) = 0.682327803828019 (빨간 점)  · 30단계면 폭이 약 10⁻⁹`;
    };
    L.q("#bs").addEventListener("click", step); L.q("#br").addEventListener("click", reset); resizeFn = () => draw(); reset();
  },
  minimum(el) {
    const f = x => x ** 3 - 3 * x;
    const L = labShell(el, "닫힌 구간의 최솟값: 극소와 끝점", "f(x) = x³ − 3x", `<label for="ma">왼쪽 끝 a <input id="ma" type="range" min="-3" max="0.5" step="0.1" value="-3"></label><b id="mav"></b><label for="mb">오른쪽 끝 b <input id="mb" type="range" min="0.6" max="3" step="0.1" value="3"></label><b id="mbv"></b>`);
    const draw = () => {
      const a = +L.q("#ma").value, b = +L.q("#mb").value; L.q("#mav").textContent = a.toFixed(1); L.q("#mbv").textContent = b.toFixed(1);
      const cand = [[a, "끝점"], [b, "끝점"], ...[-1, 1].filter(c => c > a && c < b).map(c => [c, c < 0 ? "극대" : "극소"])];
      const vals = cand.map(([x, k]) => [x, f(x), k]); const mn = vals.reduce((u, v) => v[1] < u[1] ? v : u), mx = vals.reduce((u, v) => v[1] > u[1] ? v : u);
      let lo = a, hi = b; const r = (Math.sqrt(5) - 1) / 2; let c = hi - r * (hi - lo), d = lo + r * (hi - lo);
      for (let i = 0; i < 80; i++) { if (f(c) < f(d)) hi = d; else lo = c; c = hi - r * (hi - lo); d = lo + r * (hi - lo); }
      const xs = (lo + hi) / 2;
      const p = Plot(L.cv, [-3.2, 3.2], [-19, 19]).axes(ticks(-3, 3, 6), ticks(-18, 18, 6));
      const ctx = p.ctx; ctx.fillStyle = css("--accent-soft"); ctx.fillRect(p.X(a), p.pad.t, p.X(b) - p.X(a), p.H - p.pad.t - p.pad.b);
      p.fn(f, css("--ink"), 2); vals.forEach(([x, y]) => p.dot(x, y, css("--muted"), 3.5)); p.dot(mn[0], mn[1], css("--warn"), 6).dot(xs, f(xs), css("--c2"), 4).done();
      const trap = Math.abs(f(xs) - mn[1]) > 1e-6;
      L.ro.innerHTML = vals.map(([x, y, k]) => `${k.padEnd(3, " ")} x = ${(+x.toFixed(3)).toString().padStart(5)}   f(x) = ${(+y.toFixed(3))}`).join("\n") +
        `\n최솟값 ${(+mn[1].toFixed(3))} (x = ${+mn[0].toFixed(3)}, 빨간 점)   최댓값 ${(+mx[1].toFixed(3))} (x = ${+mx[0].toFixed(3)})\n수치 국소 탐색(황금분할) → x ≈ ${xs.toFixed(4)}, f = ${f(xs).toFixed(4)} (주황 점)` +
        (trap ? `\n<span class="hl">수치 탐색이 극소에 머물러 실제 최솟값을 놓쳤다. 끝점의 값과 꼭 비교해야 한다.</span>` : `\n이 구간에서는 수치 탐색도 최솟값을 찾았다.`);
    };
    L.q("#ma").addEventListener("input", draw); L.q("#mb").addEventListener("input", draw); resizeFn = draw; draw();
  },
  hilbert(el) {
    const L = labShell(el, "소수 계산 vs 분수 계산: 힐베르트 행렬", "Hᵢⱼ = 1/(i + j − 1), H × H⁻¹이 단위행렬인지", `<label for="hn">크기 n <input id="hn" type="range" min="2" max="12" step="1" value="12"></label><b id="hnv"></b>`);
    const floatErr = n => {
      const A = [...Array(n)].map((_, i) => [...Array(n)].map((_, j) => 1 / (i + j + 1))), M = A.map((r, i) => [...r, ...r.map((_, j) => +(i === j))]);
      for (let c = 0; c < n; c++) { let piv = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r; [M[c], M[piv]] = [M[piv], M[c]]; const d = M[c][c]; for (let k = 0; k < 2 * n; k++) M[c][k] /= d; for (let r = 0; r < n; r++) if (r !== c) { const fct = M[r][c]; for (let k = 0; k < 2 * n; k++) M[r][k] -= fct * M[c][k]; } }
      const inv = M.map(r => r.slice(n)); let e = 0; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { let s = 0; for (let k = 0; k < n; k++) s += A[i][k] * inv[k][j]; e = Math.max(e, Math.abs(s - (i === j))); } return e;
    };
    const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
    const Fr = (p, q = 1n) => { if (q < 0n) { p = -p; q = -q; } const g = gcd(p, q) || 1n; return [p / g, q / g]; };
    const add = (x, y) => Fr(x[0] * y[1] + y[0] * x[1], x[1] * y[1]), mul = (x, y) => Fr(x[0] * y[0], x[1] * y[1]), div = (x, y) => Fr(x[0] * y[1], x[1] * y[0]), neg = x => [-x[0], x[1]];
    const exactErr = n => {
      const A = [...Array(n)].map((_, i) => [...Array(n)].map((_, j) => Fr(1n, BigInt(i + j + 1))));
      const M = A.map((r, i) => [...r, ...r.map((_, j) => Fr(BigInt(+(i === j))))]);
      for (let c = 0; c < n; c++) { const d = M[c][c]; for (let k = 0; k < 2 * n; k++) M[c][k] = div(M[c][k], d); for (let r = 0; r < n; r++) if (r !== c && M[r][c][0] !== 0n) { const fct = M[r][c]; for (let k = 0; k < 2 * n; k++) M[r][k] = add(M[r][k], neg(mul(fct, M[c][k]))); } }
      const inv = M.map(r => r.slice(n)); let bad = 0; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { let s = Fr(0n); for (let k = 0; k < n; k++) s = add(s, mul(A[i][k], inv[k][j])); if (!(s[0] === BigInt(+(i === j)) && s[1] === 1n)) bad++; }
      return { bad, big: inv.flat().reduce((m, x) => { const v = x[0] < 0n ? -x[0] : x[0]; return v > m ? v : m; }, 0n) };
    };
    const errs = []; for (let n = 2; n <= 12; n++) errs.push([n, floatErr(n)]);
    const draw = () => {
      const n = +L.q("#hn").value; L.q("#hnv").textContent = n + " × " + n;
      const p = Plot(L.cv, [1.5, 12.5], [-17, 1]).axes(ticks(2, 12, 10), [-16, -12, -8, -4, 0]);
      p.poly(errs.map(([k, e]) => [k, Math.log10(Math.max(e, 1e-17))]), css("--c1"), 2);
      errs.forEach(([k, e]) => p.dot(k, Math.log10(Math.max(e, 1e-17)), k === n ? css("--warn") : css("--c1"), k === n ? 6 : 3.5)); p.done();
      const ex = exactErr(n), fe = errs[n - 2][1];
      L.ro.innerHTML = `세로축: log₁₀(단위행렬과의 최대 오차)\n소수(64비트 부동소수점, 가우스-조던 소거) : 최대 오차 <span class="hl">${fe.toExponential(2)}</span>\n  (NumPy는 계산 순서가 달라 12×12에서 0.089. 값은 달라도 n이 커질수록 오차가 급격히 커지는 것은 같다)\n분수(SymPy처럼 정확한 유리수)            : 틀린 성분 ${ex.bad}개 → H × H⁻¹ = 단위행렬 (오차 0)\nH⁻¹ 성분의 최대 크기 ≈ ${ex.big.toString().length > 12 ? (Number(ex.big)).toExponential(2) : ex.big.toString()}  ← 이렇게 큰 수끼리 빼면서 소수 오차가 커진다`;
    };
    L.q("#hn").addEventListener("input", draw); resizeFn = draw; draw();
  }
};

LABS.expeq = function (el) {
  const L = labShell(el, "x로 볼까, t = 3ˣ로 볼까", "3²ˣ − 6·3ˣ − 27 = 0", `<label for="em">보기 <select id="em"><option value="x">x의 그래프 + nsolve</option><option value="t">t = 3ˣ로 치환</option></select></label><label for="ex" id="exl">nsolve 초기값 <input id="ex" type="range" min="0" max="3.5" step="0.05" value="2.5"></label><b id="exv"></b>`);
  const g = x => Math.pow(9, x) - 6 * Math.pow(3, x) - 27, q = t => t * t - 6 * t - 27;
  const draw = () => {
    const mode = L.q("#em").value; L.q("#exl").style.display = mode === "x" ? "" : "none"; L.q("#exv").style.display = mode === "x" ? "" : "none";
    if (mode === "x") {
      const x0 = +L.q("#ex").value; L.q("#exv").textContent = "x₀ = " + x0.toFixed(2);
      let a = x0, b = x0 + 0.1; const path = [a];
      for (let i = 0; i < 60; i++) { const fa = g(a), fb = g(b); if (fb === fa || !isFinite(fb)) break; const c = b - fb * (b - a) / (fb - fa); a = b; b = c; path.push(b); if (Math.abs(b - a) < 1e-13) break; }
      const p = Plot(L.cv, [-1, 3], [-40, 60]).axes(ticks(-1, 3, 8), ticks(-40, 60, 5));
      p.fn(g, css("--ink"), 2);
      for (let i = 0; i + 1 < path.length && i < 8; i++) { const u = path[i], v = path[i + 1]; if (Math.abs(u) > 5 || Math.abs(v) > 5) break; p.poly([[u, Math.max(-40, Math.min(60, g(u)))], [v, 0]], css("--c2"), 1); }
      p.dot(x0, Math.max(-40, Math.min(60, g(x0))), css("--c2"), 5); const ok = isFinite(b) && Math.abs(b - 2) < 1e-6; if (isFinite(b) && Math.abs(b) < 5) p.dot(b, 0, css("--c1"), 6); p.done();
      L.ro.innerHTML = `nsolve(…, x, ${x0.toFixed(2)})  →  ${isFinite(b) ? b.toFixed(12) : "수렴 실패"}   (주황 선: 반복 과정)\n` + (ok ? `nsimplify(…) → 2` : `<span class="hl">초기값이 너무 멀면 수렴하지 않는다.</span>`);
    } else {
      const p = Plot(L.cv, [-6, 12], [-45, 40]).axes(ticks(-6, 12, 9), ticks(-40, 40, 4));
      const ctx = p.ctx; ctx.fillStyle = css("--warn-soft"); ctx.fillRect(p.X(-6), p.pad.t, p.X(0) - p.X(-6), p.H - p.pad.t - p.pad.b);
      p.fn(q, css("--ink"), 2).dot(9, 0, css("--c1"), 6).dot(-3, 0, css("--warn"), 6).done();
      L.ro.innerHTML = `t² − 6t − 27 = 0  →  solve → [−3, 9]\n<span class="hl">t = 3ˣ > 0 이므로 t = −3은 버린다 (주황 영역).</span>\nt = 9 → x = 2`;
    }
  };
  L.q("#em").addEventListener("change", draw); L.q("#ex").addEventListener("input", draw); resizeFn = draw; draw();
};
applySettings();
if (getSet("pre") === "1") PY.start();
render();
</script>
